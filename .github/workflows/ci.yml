name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
      - run: python -m compileall -q server evaluation tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/check_html.mjs
