<meta charset="utf-8">
<title>Shemoneh Esrei Master ‚Äî Reading Trainer</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#f6f3ea; --panel:#fffdf7; --panel2:#efe9da; --line:#ddd5c2;
  --ink:#25304e; --ink2:#66708c; --accent:#2456a6; --accent-ink:#ffffff;
  --gold:#a8781c; --gold-bg:#f7ecd2;
  --ok:#187a4b; --ok-bg:#e2f2e7; --warn:#a35d00; --warn-bg:#faedd4; --bad:#b3383e; --bad-bg:#f9e2e3;
  --cur:#2456a6; --cur-bg:#e3ecfa;
  --shadow:0 2px 10px rgba(37,48,78,.08);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131828; --panel:#1c2336; --panel2:#242d45; --line:#333d5c;
    --ink:#e9e7dd; --ink2:#9aa3bd; --accent:#7aa7e8; --accent-ink:#10203c;
    --gold:#d9b45c; --gold-bg:#3a3220;
    --ok:#5ecb93; --ok-bg:#153525; --warn:#eab35e; --warn-bg:#3a2d13; --bad:#f08a8f; --bad-bg:#3d1d20;
    --cur:#7aa7e8; --cur-bg:#22335c;
    --shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="light"]{
  --bg:#f6f3ea; --panel:#fffdf7; --panel2:#efe9da; --line:#ddd5c2;
  --ink:#25304e; --ink2:#66708c; --accent:#2456a6; --accent-ink:#ffffff;
  --gold:#a8781c; --gold-bg:#f7ecd2;
  --ok:#187a4b; --ok-bg:#e2f2e7; --warn:#a35d00; --warn-bg:#faedd4; --bad:#b3383e; --bad-bg:#f9e2e3;
  --cur:#2456a6; --cur-bg:#e3ecfa;
  --shadow:0 2px 10px rgba(37,48,78,.08);
}
:root[data-theme="dark"]{
  --bg:#131828; --panel:#1c2336; --panel2:#242d45; --line:#333d5c;
  --ink:#e9e7dd; --ink2:#9aa3bd; --accent:#7aa7e8; --accent-ink:#10203c;
  --gold:#d9b45c; --gold-bg:#3a3220;
  --ok:#5ecb93; --ok-bg:#153525; --warn:#eab35e; --warn-bg:#3a2d13; --bad:#f08a8f; --bad-bg:#3d1d20;
  --cur:#7aa7e8; --cur-bg:#22335c;
  --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:860px;margin:0 auto;padding:12px 14px 80px}
.heb{font-family:"Frank Ruhl Libre","Frank Ruehl CLM","Times New Roman","Noto Serif Hebrew","SBL Hebrew",David,serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--panel2);color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
textarea{width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin:12px 0}
.muted{color:var(--ink2);font-size:.9em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
h1,h2,h3{text-wrap:balance;margin:.3em 0}
h1{font-size:1.5rem}
h2{font-size:1.2rem}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;background:var(--panel2);color:var(--ink2)}
/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:2px solid var(--line);margin-bottom:10px}
header.top .brand{display:flex;align-items:center;gap:10px}
header.top .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:20px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{padding:7px 13px;border-radius:99px;font-size:.9rem}
nav.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
/* ladder */
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rung{position:relative;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);text-align:center;cursor:pointer;transition:transform .12s}
.rung:hover{transform:translateY(-2px)}
.rung.locked{opacity:.55;cursor:not-allowed;background:var(--panel2)}
.rung.mastered{border-color:var(--gold);background:var(--gold-bg)}
.rung .num{position:absolute;top:6px;left:9px;font-size:.72rem;color:var(--ink2)}
.rung .star{font-size:1.15rem}
.rung .nm{font-weight:700;font-size:1.05rem;margin:4px 0 2px}
.rung .sub{font-size:.75rem;color:var(--ink2)}
.rung .sc{font-size:.8rem;color:var(--ink2)}
/* reading view */
.tefilla{font-size:var(--tsize,2rem);line-height:2.1;text-align:right;direction:rtl}
.phrase{padding:8px 12px;border-radius:12px;margin:4px 0}
.phrase.active{background:var(--cur-bg);box-shadow:inset -3px 0 0 var(--cur)}
.phrase .trans{font-size:.95rem;color:var(--ink2);direction:ltr;text-align:left;line-height:1.4;margin-top:2px;font-family:system-ui,sans-serif}
.w{padding:1px 4px;border-radius:7px;transition:background .15s}
.w.cur{background:var(--cur-bg);box-shadow:0 2px 0 var(--cur)}
@keyframes pulse{50%{opacity:.55}}
.w.cur.listening{animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.w.cur.listening{animation:none}}
.w.ok{background:var(--ok-bg);color:var(--ok)}
.w.warn{background:var(--warn-bg);color:var(--warn)}
.w.bad{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy var(--bad) 1.5px}
.w.trouble{box-shadow:0 2px 0 var(--warn)}
/* mic bar */
.micbar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;display:flex;gap:12px;align-items:center;margin-top:14px}
.micbtn{width:58px;height:58px;border-radius:50%;font-size:24px;background:var(--accent);color:var(--accent-ink);flex:none}
.micbtn.live{background:var(--bad)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(179,56,62,.45)}100%{box-shadow:0 0 0 16px rgba(179,56,62,0)}}
.micbtn.live{animation:ring 1.2s infinite}
@media (prefers-reduced-motion:reduce){.micbtn.live{animation:none}}
.interim{flex:1;min-height:1.4em;color:var(--ink2);font-size:.95rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.interim .hebtxt{direction:rtl;unicode-bidi:isolate}
.livestats{font-variant-numeric:tabular-nums;font-weight:700}
/* score */
.scorewrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bigscore{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--warn)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel2);border-radius:10px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink2)}
/* mistakes */
.mistake{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--panel2);margin:6px 0;flex-wrap:wrap}
.mistake .exp{font-size:1.5rem;direction:rtl;unicode-bidi:isolate}
.mistake .heard .hebtxt{direction:rtl;unicode-bidi:isolate;font-weight:700}
.dl{color:var(--bad);font-weight:800}
.mistake .why{font-size:.82rem;color:var(--ink2);flex-basis:100%}
/* table */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;font-variant-numeric:tabular-nums}
th{color:var(--ink2);font-weight:600;font-size:.8rem}
/* misc */
.toggles label{display:flex;gap:8px;align-items:center;padding:4px 0}
.center{text-align:center}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);max-width:520px;width:92%}
dialog::backdrop{background:rgba(10,14,25,.45)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;opacity:.9;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.notice{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:10px;margin:10px 0;font-size:.92rem}
.micreport{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;background:var(--panel2);border-radius:10px;padding:12px;margin-top:10px}
footer.src{margin-top:26px;font-size:.75rem;color:var(--ink2);text-align:center}
</style>

<div id="app"></div>

const FINALS={'◊ö':'◊õ','◊ù':'◊û','◊ü':'◊†','◊£':'◊§','◊•':'◊¶'};
function norm(w){ // vocalized or plain word -> bare letters
  let s=(w||'').replace(/[^◊ê-◊™]/g,'');
  s=s.replace(/[◊ö◊ù◊ü◊£◊•]/g,c=>FINALS[c]);
  return s;
}
function normTranscript(w){
  let s=norm(w);
  s=s.replace(/◊ê◊ú◊ï?◊ß/g,'◊ê◊ú◊î');     // Elokim-spellings (◊ê◊ú◊ï◊ß◊ô◊†◊ï/◊ê◊ú◊ß◊ô◊ù) -> Elohim family
  return s;
}
const FOLD_MAP={'◊¢':'◊ê','◊ò':'◊™','◊ß':'◊õ','◊ó':'◊õ','◊°':'◊©'};
function fold(s){let o='';for(const c of s)o+=(FOLD_MAP[c]||c);return o;}
function foldAshk(s){ // extra leniency for Ashkenazi havara: sav (◊™->◊°) BEFORE the ◊°->◊© fold, then "oy"->"o"
  return fold(s.replace(/◊™/g,'◊°')).replace(/◊ï◊ô/g,'◊ï');
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  let prev=new Array(n+1),cur=new Array(n+1);
  for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function ratio(a,b){
  if(!a.length&&!b.length)return 1;
  const d=lev(a,b);
  return 1-d/Math.max(a.length,b.length);
}
const DIVINE=new Set(['◊î◊©◊û','◊ê◊ì◊†◊ô','◊ê◊ì◊ï◊†◊ô','◊ê◊ì◊ï◊©◊û','◊ê◊ì◊†◊ï◊ô','◊ô◊î◊ï◊î']); // final letters already folded by norm() ‚Äî bare '◊î' removed so the divine slot can't trivially pass
function isDivineTarget(n){return n==='◊ô◊î◊ï◊î';}
const MATRES=new Set(['◊ê','◊î','◊ï','◊ô']);
function singleEdit(a,b){ // if a->b is one edit, return {type:'sub'|'ins'|'del', ca, cb}
  const la=a.length,lb=b.length;
  if(Math.abs(la-lb)>1)return null;
  if(la===lb){
    let d=-1;
    for(let i=0;i<la;i++)if(a[i]!==b[i]){if(d>=0)return null;d=i;}
    return d>=0?{type:'sub',ca:a[d],cb:b[d]}:null;
  }
  const [sh,lo]=la<lb?[a,b]:[b,a];
  let i=0;while(i<sh.length&&sh[i]===lo[i])i++;
  if(sh.slice(i)!==lo.slice(i+1))return null;
  return {type:la<lb?'ins':'del',ca:lo[i],cb:lo[i]};
}
function analyzeEdits(a,b,maxE){ // list of ‚â§maxE edits turning a into b, matres-insertions preferred; null if more
  if(a===b)return [];
  const e=singleEdit(a,b);
  if(e)return [e];
  if(maxE<2)return null;
  const [sh,lo,dir]=a.length<=b.length?[a,b,'ins']:[b,a,'del'];
  for(let i=0;i<lo.length;i++){
    if(!MATRES.has(lo[i]))continue;
    const lo2=lo.slice(0,i)+lo.slice(i+1);
    const sub=dir==='ins'?analyzeEdits(sh,lo2,maxE-1):analyzeEdits(lo2,sh,maxE-1);
    if(sub)return [{type:dir,ca:lo[i],cb:lo[i]},...sub];
  }
  return null;
}
function simWords(tNorm,gNorm,ashk){ // transcript token vs target word (both normalized)
  if(isDivineTarget(gNorm))return DIVINE.has(tNorm)?1:0;
  if(!tNorm||!gNorm)return 0;
  if(tNorm===gNorm)return 1;
  const ft=fold(tNorm),fg=fold(gNorm);
  if(ft===fg)return 0.97;                      // identical sound (◊ò/◊™, ◊õ/◊ß, ◊ê/◊¢, ◊°/◊©◊Ç spelling variance)
  if(ashk&&foldAshk(tNorm)===foldAshk(gNorm))return 0.94;
  if(gNorm.length<=2||tNorm.length<=2)return 0; // short words: sound-exact or nothing
  const edits=analyzeEdits(ft,fg,2);
  if(edits){
    const real=edits.filter(e=>e.type==='sub'||!MATRES.has(e.ca));
    if(real.length===0)return 0.9;   // only plene/defective spelling differences (extra ◊ô/◊ï etc.)
    if(real.length===1)return 0.55;  // ONE real sound wrong (e.g. ◊ì/◊®) -> "almost", flagged
    return 0.3;
  }
  let s=Math.max(ratio(tNorm,gNorm),ratio(ft,fg));
  if(ashk)s=Math.max(s,ratio(foldAshk(tNorm),foldAshk(gNorm)));
  return Math.min(s,0.62); // 2+ sounds differ: never auto-green
}
/* word states */
const ST={PENDING:0,OK:1,WARN:2,BAD:3};
const TH_OK=0.65, TH_WARN=0.35, TH_MERGE=0.72;
const MAX_SKIP=2; // a single confident match may skip at most this many un-read words (prevents line-leaps)
const SKIP_TOKEN='__SKIP__';
function stateFor(s){return s>=TH_OK?ST.OK:(s>=TH_WARN?ST.WARN:ST.BAD);}

/* Full (re-)alignment of a token stream against the target words.
   Called on EVERY recognition update (including interim results), so coloring is
   near-instant and self-corrects as the recognizer firms up its transcript. */
function alignTokens(tokens,words,ashk){
  const st=new Array(words.length).fill(null); // per word: {state,score,heard} | null(pending)
  let c=0, streak=0, prev=null, skips=0; // skips = words auto-marked BAD by a jump-ahead (used for confidence/flagging)
  for(const raw of tokens){
    if(c>=words.length)break;
    if(raw===SKIP_TOKEN){ // manual skip / tap-ahead (deliberate, not counted as an auto-skip)
      st[c]={state:ST.BAD,score:0,heard:null};c++;prev=null;streak=0;continue;
    }
    const t=normTranscript(raw);
    if(!t)continue;
    const W=streak>=3?12:8;               // widen the search window only to FIND the word ‚Äî never to authorize a big leap
    const end=Math.min(c+W,words.length);

    // (1) Does this token read the CURRENT word (possibly imperfectly)?
    const curS=simWords(t,words[c].norm,ashk);
    // (2) Merge: one spoken token covering the current word + the next one.
    const mS=(c+1<words.length)?simWords(t,words[c].norm+words[c+1].norm,ashk):0;
    // (3) Best match anywhere in the window (to detect a genuine short skip ahead).
    let best=-1,bs=0;
    for(let i=c;i<end;i++){const s=simWords(t,words[i].norm,ashk);if(s>bs){bs=s;best=i;}}

    // Merge wins only if it clearly beats reading the current word alone.
    if(mS>=TH_MERGE&&mS>curS&&mS>=bs){
      st[c]={state:stateFor(mS),score:mS,heard:raw};
      st[c+1]={state:ST.WARN,score:mS,heard:raw}; // 2nd word not independently verified ‚Üí "almost", not full credit
      c+=2;prev=null;streak=0;continue;
    }
    // Prefer reading the current word if it's acceptable ‚Äî do NOT jump ahead when the current word matched.
    if(curS>=TH_WARN){
      st[c]={state:stateFor(curS),score:curS,heard:raw};
      c++;prev=null;streak=0;continue;
    }
    // Current word wasn't matched. Allow only a SHORT + CONFIDENT skip to a word just ahead.
    if(best>c&&bs>=TH_OK&&best-c<=MAX_SKIP){
      for(let k=c;k<best;k++){st[k]={state:ST.BAD,score:0,heard:null};skips++;}
      st[best]={state:stateFor(bs),score:bs,heard:raw};
      c=best+1;prev=null;streak=0;continue;
    }
    // Split: recognizer broke one word into two tokens (prev + this) ‚Üí the current word.
    if(prev){
      const js=simWords(prev.t+t,words[c].norm,ashk);
      if(js>=TH_OK){
        st[c]={state:stateFor(js),score:js,heard:prev.raw+' '+raw};
        c++;prev=null;streak=0;continue;
      }
    }
    // Unmatched token: keep it as a possible split fragment; cursor stays put (no silent leap).
    prev={t,raw};streak++;
  }
  return {st,cursor:c,skips};
}
function alignScore(tokens,words,ashk){ // used to pick the best ASR alternative
  const r=alignTokens(tokens,words,ashk);
  const mass=r.st.reduce((s,x)=>s+(x?x.score:0),0);
  return mass-0.5*(r.skips||0); // penalize auto-skipped gaps so a jump-ahead alternative can't win on raw mass
}

/* letter-level diff for mistake feedback */
function letterDiff(exp,heard){
  const a=exp,b=heard;
  const m=a.length,n=b.length;
  const dp=[];
  for(let i=0;i<=m;i++){dp[i]=[];for(let j=0;j<=n;j++){dp[i][j]=i===0?j:(j===0?i:Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)));}}
  const A=[],B=[];let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){
      const d=a[i-1]!==b[j-1];A.unshift({c:a[i-1],diff:d});B.unshift({c:b[j-1],diff:d});i--;j--;
    }else if(i>0&&dp[i][j]===dp[i-1][j]+1){A.unshift({c:a[i-1],diff:true});i--;}
    else{B.unshift({c:b[j-1],diff:true});j--;}
  }
  return [A,B];
}
const CONFUSIONS=[[['◊ì','◊®'],'Did you read a ◊ì (dalet) as a ◊® (reish), or the other way around? Look for the corner on the dalet.'],
 [['◊î','◊ó'],'◊î (hey) vs ◊ó (ches) ‚Äî check whether the left leg has a gap at the top.'],
 [['◊ë','◊õ'],'◊ë (beis) vs ◊õ (chaf) ‚Äî the beis has a square corner and a little heel.'],
 [['◊ï','◊ñ'],'◊ï (vav) vs ◊ñ (zayin) ‚Äî the zayin has a crown on top.'],
 [['◊í','◊†'],'◊í (gimmel) vs ◊† (nun) ‚Äî the gimmel has a little foot.'],
 [['◊ò','◊û'],'◊ò (tes) vs ◊û (mem) ‚Äî check the opening.'],
 [['◊¢','◊¶'],'◊¢ (ayin) vs ◊¶ (tzadi).'],
 [['◊™','◊ó'],'◊™ (taf) vs ◊ó (ches) ‚Äî the taf has a foot on the left leg.']];
function classifyMistake(expN,heardN){
  if(!heardN)return 'This word was skipped or not heard.';
  const [A,B]=letterDiff(expN,heardN);
  const diffsA=A.filter(x=>x.diff).map(x=>x.c), diffsB=B.filter(x=>x.diff).map(x=>x.c);
  if(diffsA.length===1&&diffsB.length===1){
    for(const [pair,msg] of CONFUSIONS){
      if((pair[0]===diffsA[0]&&pair[1]===diffsB[0])||(pair[1]===diffsA[0]&&pair[0]===diffsB[0]))return msg;
    }
    if(fold(diffsA[0])===fold(diffsB[0]))return 'Very close ‚Äî a letter may not have been pronounced clearly.';
    return 'One letter is different: expected "'+diffsA[0]+'" but heard "'+diffsB[0]+'".';
  }
  if(fold(expN)===fold(heardN))return 'Almost! It sounded very close ‚Äî make sure to pronounce each letter clearly.';
  return 'This word sounded different ‚Äî try reading it slowly, letter by letter.';
}

/* ================= word list builder ================= */
function activeSegs(bracha,settings){
  return bracha.segs.filter(s=>{
    switch(s.c){
      case 'always':return true;
      case 'winter':return settings.winter;
      case 'notwinter':return !settings.winter;
      case 'ayt':return settings.ayt;
      case 'notayt':return !settings.ayt;
      case 'rc':return settings.rc;
      case 'nissim':return settings.chanukah||settings.purim;
      case 'chanukah':return settings.chanukah;
      case 'purim':return settings.purim;
      default:return true;
    }
  });
}
function buildWords(bIdx,settings){
  const b=DATA.brachot[bIdx];
  const segs=activeSegs(b,settings);
  const words=[];const phrases=[];
  segs.forEach((seg,si)=>{
    const chunks=(seg.ph&&seg.ph.length)?seg.ph:seg.t.split(/(?<=[:.])\s+/).map(t=>({t}));
    chunks.forEach(ch=>{
      const pIdx=phrases.length;
      phrases.push({trans:ch.en||null,words:[],seg:si});
      ch.t.split(/\s+/).forEach(tok=>{
        const parts=tok.split('÷æ');
        parts.forEach((p,pi)=>{
          const display=p+(pi<parts.length-1?'÷æ':'');
          const n=norm(p);
          if(!n&&!/[◊ê-◊™]/.test(p))return;
          const w={display,norm:n,phrase:pIdx,state:ST.PENDING,score:0,heard:null};
          phrases[pIdx].words.push(words.length);
          words.push(w);
        });
      });
    });
  });
  return {words,phrases,name:b.he,en:b.en};
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function micPolicyBlocked(){
  try{return document.featurePolicy&&!document.featurePolicy.allowsFeature('microphone');}catch(_){return false;}

class Listener{
  /* onCommit(altsTokenArrays) ‚Äî a phrase just finalized; several ASR alternatives given.
     onInterim(tokens)        ‚Äî live (unfinalized) words; fired continuously for instant feedback.
     onState(state)                                                                              */
  constructor({onCommit,onInterim,onState}){
    this.onCommit=onCommit;this.onInterim=onInterim;this.onState=onState;
    this.active=false;this.rec=null;this._restartT=null;this._nCommitted=0;
  }
  start(){
    if(!SR){this.onState('unsupported');return;}
    if(micPolicyBlocked()){this.onState('policy');return;}
    this.active=true;this._spin();this.onState('live');
  }
  _spin(){
    if(!this.active)return;
    const r=new SR();this.rec=r;this._nCommitted=0;
    r.lang='he-IL';r.continuous=true;r.interimResults=true;r.maxAlternatives=4;
    const toks=s=>s.trim().split(/\s+/).filter(Boolean);
    r.onresult=(e)=>{
      let interim=[];
      for(let i=0;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){
          if(i>=this._nCommitted){            // newly finalized -> commit once
            const alts=[];
            for(let a=0;a<res.length;a++)alts.push(toks(res[a].transcript));
            this._nCommitted=i+1;
            if(alts.length&&alts[0].length)this.onCommit(alts);
          }
        }else interim=interim.concat(toks(res[0].transcript));
      }
      this.onInterim(interim);
    };
    r.onerror=(e)=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){this.active=false;this.onState('denied');}
      if(e.error==='audio-capture'){this.active=false;this.onState('nomic');}
    };
    r.onend=()=>{
      if(this.active){
        clearTimeout(this._restartT);
        this._restartT=setTimeout(()=>this._spin(),150);  // tighter restart -> fewer dead gaps
      }else this.onState('off');
    };
    try{r.start();}catch(_){/* already started */}
  }
  stop(){this.active=false;clearTimeout(this._restartT);try{this.rec&&this.rec.stop();}catch(_){}}
}
class Recorder{
  async start(){
    this.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    this.chunks=[];
    this.mr=new MediaRecorder(this.stream,{mimeType:MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':''});
    this.mr.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data);};
    this.mr.start(1000);
  }
  stop(){
    return new Promise(res=>{
      if(!this.mr||this.mr.state==='inactive'){res(null);return;}
      this.mr.onstop=()=>{
        this.stream.getTracks().forEach(t=>t.stop());
        res(new Blob(this.chunks,{type:'audio/webm'}));
      };
      this.mr.stop();
    });
  }
}

        :'permission denied (or blocked by the page host). Click the üîí/üé§ icon in the address bar and allow the microphone, then reload.',
      NotFoundError:'no microphone found on this device.',

  }

}

function bindSession(){
  const isTest=session.mode==='test';
  const micBtn=document.getElementById('micBtn');
  const interimEl=document.getElementById('interim');
  const accEl=document.getElementById('liveAcc');
  const timerEl=document.getElementById('liveTimer');
  const finishBtn=document.getElementById('finishBtn');

  const skipBtn=document.getElementById('skipBtn');
  const backBtn=document.getElementById('backBtn');
  session.committed=[];   // chosen best-alternative tokens + skip markers
  session.interim=[];     // live unfinalized tokens
  session.cursor=0;
  const ashk=S.settings.ashk;

  // Re-align the ENTIRE transcript every update: instant feedback, self-correcting, never sticks.
  function reAlign(){
    const tokens=session.committed.concat(session.interim);
    const {st,cursor}=alignTokens(tokens,session.words,ashk);
    session.cursor=cursor;
    for(let i=0;i<session.words.length;i++){
      const a=st[i],w=session.words[i];
      w.state=a?a.state:ST.PENDING;w.score=a?a.score:0;w.heard=a?a.heard:null;
      if(!isTest){
        const el=document.getElementById('w'+i);
        if(el){
          el.classList.remove('ok','warn','bad');
          if(a)el.classList.add(a.state===ST.OK?'ok':a.state===ST.WARN?'warn':'bad');
        }
      }
    }
    updateCursorUI();
    const s2=sessionStats();
    accEl.textContent=s2.donew?s2.acc+'%':'';
  }

  function updateCursorUI(){
    document.querySelectorAll('.w.cur').forEach(e=>e.classList.remove('cur','listening'));
    document.querySelectorAll('.phrase.active').forEach(e=>e.classList.remove('active'));
    const c=session.cursor;
    if(c<session.words.length&&!isTest){
      const el=document.getElementById('w'+c);
      if(el){
        el.classList.add('cur');if(session.live)el.classList.add('listening');
        const ph=document.getElementById('ph'+session.words[c].phrase);
        ph&&ph.classList.add('active');
        el.scrollIntoView({block:'center',behavior:'smooth'});
      }
    }
  }

  function commitAndCheck(){
    session.interim=[];
    reAlign();
    if(session.cursor>=session.words.length)setTimeout(()=>{if(!session.done)endSession();},400);
  }

  // Rewind: drop just enough committed tokens so re-alignment lands at (or just before) `target`,
  // then let the student re-read from there. Cursor is a pure function of committed, so we truncate.
  function rewindToWord(target){
    target=Math.max(0,Math.min(target,session.words.length-1));
    let keep=0; // cursor is monotonic in prefix length, so find the longest prefix still at/behind target
    for(let n=0;n<=session.committed.length;n++){
      const {cursor}=alignTokens(session.committed.slice(0,n),session.words,ashk);
      if(cursor<=target)keep=n; else break;
    }
    session.committed=session.committed.slice(0,keep);
    session.interim=[];
    reAlign();
  }

  session.listener=new Listener({
    onCommit:(alts)=>{
      if(!session.startT)startTimer();
      let best=alts[0],bestSc=-1;                 // keep the ASR alternative that best fits the tefillah
      for(const alt of alts){
        const sc=alignScore(session.committed.concat(alt),session.words,ashk);
        if(sc>bestSc){bestSc=sc;best=alt;}
      }
      session.committed=session.committed.concat(best);
      commitAndCheck();
    },
    onInterim:(tokens)=>{
      if(!session.startT&&tokens.length)startTimer();
      session.interim=tokens;
      if(tokens.length)interimEl.innerHTML='<span class="hebtxt">'+esc(tokens.join(' '))+'</span>';
      reAlign();
    },
    onState:(st)=>{
      session.live=(st==='live');
      micBtn.classList.toggle('live',session.live);
      micBtn.textContent=session.live?'‚è∏':'üé§';
      if(skipBtn)skipBtn.style.display=session.live?'':'none';
      if(backBtn)backBtn.style.display=session.live?'':'none';
      if(MIC_MSG[st])interimEl.textContent=MIC_MSG[st];
      updateCursorUI();
    }
  });

  // Skip button: mark the current word missed and move on.
  if(skipBtn)skipBtn.addEventListener('click',()=>{
    session.committed=session.committed.concat(SKIP_TOKEN);
    commitAndCheck();
  });
  // Back button: step back one word to re-read it.
  if(backBtn)backBtn.addEventListener('click',()=>{rewindToWord(session.cursor-1);});
  // Tap any word: earlier ‚Üí go back and re-read; later ‚Üí jump ahead (pads skips in between).
  document.querySelectorAll('[data-w]').forEach(el=>el.addEventListener('click',()=>{
    if(isTest)return;
    const j=+el.dataset.w;
    if(j<session.cursor){rewindToWord(j);return;}
    if(j>session.cursor){
      for(let k=session.cursor;k<j;k++)session.committed.push(SKIP_TOKEN);
      commitAndCheck();
    }
  }));

  function startTimer(){
    session.startT=Date.now();
    session.timerI=setInterval(()=>{
      const s=Math.floor((Date.now()-session.startT)/1000);
      timerEl.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    },500);
  }

  micBtn.addEventListener('click',async()=>{
    if(session.live){session.listener.stop();return;}
    if(isTest&&!session.recorder){
      try{session.recorder=new Recorder();await session.recorder.start();}
      catch(e){
        const why={NotAllowedError:MIC_MSG.denied,NotFoundError:MIC_MSG.nomic,NotReadableError:'‚ö†Ô∏è The microphone is busy in another app.'}[e.name]||('‚ö†Ô∏è Recording failed: '+e.name);
        interimEl.textContent=why;session.recorder=null;return;
      }
    }
    session.listener.start();
    finishBtn.style.display='';
    if(!session.startT)startTimer();
  });
  finishBtn.addEventListener('click',()=>endSession());
  document.getElementById('exitSession').addEventListener('click',()=>{go({name:'bracha',bracha:session.bIdx});});
  const listenBtn=document.getElementById('listenBtn');
  AudioDB.get(session.bIdx).then(clip=>{
    if(!listenBtn)return;
    if(clip){
      listenBtn.style.display='';
      listenBtn.title='Listen to your teacher read this bracha';
      listenBtn.textContent='üîäüë®‚Äçüè´';
      listenBtn.onclick=()=>{
        if(session.refAudio&&!session.refAudio.paused){session.refAudio.pause();session.refAudio=null;listenBtn.textContent='üîäüë®‚Äçüè´';return;}
        session.refAudio=new Audio(URL.createObjectURL(clip));
        session.refAudio.onended=()=>{listenBtn.textContent='üîäüë®‚Äçüè´';};
        session.refAudio.play();listenBtn.textContent='‚è∏';
      };
    }else if(S.settings.tts&&('speechSynthesis' in window)){
      listenBtn.style.display='';
      listenBtn.title='Listen (computer voice ‚Äî approximate, always says "Hashem")';
      listenBtn.onclick=()=>{
        // never let the computer voice attempt Hashem's name ‚Äî substitute "Hashem"
        const spoken=session.words.map(w=>(w.norm==='◊ô◊î◊ï◊î'||w.norm==='◊ê◊ì◊†◊ô')?'◊î÷∑◊©÷µ÷º◊Å◊ù':w.display).join(' ');
        speakHebrew(spoken);
      };
    }
  }).catch(()=>{});
  if(DEBUG){
    const dbg=document.getElementById('dbg');
    dbg&&dbg.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        if(!session.startT)startTimer();
        session.committed=session.committed.concat(dbg.value.trim().split(/\s+/).filter(Boolean));
        dbg.value='';commitAndCheck();
      }
    });
  }
  reAlign();
}
async function endSession(){
  if(session.done)return;session.done=true;
  session.listener&&session.listener.stop();
  session.timerI&&clearInterval(session.timerI);
  const durMs=session.startT?Date.now()-session.startT:0;
  // final scoring from committed tokens only (drop any half-heard interim tail)
  const {st,skips}=alignTokens(session.committed,session.words,S.settings.ashk);
  for(let i=0;i<session.words.length;i++){
    const a=st[i],w=session.words[i];
    w.state=a?a.state:ST.BAD;w.score=a?a.score:0;w.heard=a?a.heard:null;
    if(w.state!==ST.OK)S.wordErr[session.bIdx+':'+w.norm]=(S.wordErr[session.bIdx+':'+w.norm]||0)+1;
  }
  if(session.recorder){session.audioBlob=await session.recorder.stop();}
  const score=finalScore();
  const stats=sessionStats();
  const wpm=durMs>=5000?Math.round(stats.ok/(durMs/60000)):0;
  const isTest=session.mode==='test';
  // Confidence flag: the computer can't hear every letter distinction, so surface the reads it's unsure
  // about for the teacher to review rather than pretending the auto-grade is final.
  const warnRatio=stats.total?stats.warn/stats.total:0;
  const flagReasons=[];
  if(score>=55&&score<S.settings.masteryPct)flagReasons.push('score near the pass line');
  if(stats.warn>=3&&warnRatio>=0.15)flagReasons.push(stats.warn+' "almost" words');
  if((skips||0)>=2)flagReasons.push('several words skipped');
  const flagged=isTest&&flagReasons.length>0;
  let newlyMastered=false;
  if(isTest){
    const p=S.progress[session.bIdx]||{mastered:false,best:0,attempts:0};
    p.attempts++;p.lastDate=new Date().toISOString().slice(0,10);
    if(score>p.best)p.best=score;
    if(score>=S.settings.masteryPct&&!p.mastered){p.mastered=true;newlyMastered=true;}
    S.progress[session.bIdx]=p;
    const missed=session.words.map((w,i)=>w.state===ST.BAD?i:-1).filter(i=>i>=0);
    const partial=session.words.map((w,i)=>w.state===ST.WARN?i:-1).filter(i=>i>=0);
    session.resultCode=encodeResult({v:1,n:S.profile.name,c:S.profile.cls,b:session.bIdx+1,bn:DATA.brachot[session.bIdx].he,d:p.lastDate,a:score,w:wpm,dur:Math.round(durMs/1000),m:missed,p:partial,tw:session.words.length,fl:flagged?1:0,fr:flagReasons});
    S.history.unshift({b:session.bIdx,a:score,d:p.lastDate,f:flagged?1:0});S.history=S.history.slice(0,50);
  }
  saveStore();
  session.final={score,wpm,durMs,newlyMastered,flagged,flagReasons};
  view={name:'results'};
  render();
  if(newlyMastered)confetti();
}

function bindTeacher(){

  const refRows=document.getElementById('refRows');
  let refRec=null,refRecIdx=-1,playingA=null;
  async function drawRefRows(){
    const have=new Set(await AudioDB.keys().catch(()=>[]));
    refRows.innerHTML=DATA.brachot.map((b,i)=>`<tr>
      <td style="width:30px">${i+1}</td>
      <td><span class="heb">${esc(b.he)}</span></td>

      <td style="width:230px">
        <button data-refrec="${i}">${refRecIdx===i?'‚èπ Stop':'üéôÔ∏è Record'}</button>
        ${have.has(i)?`<button data-refplay="${i}">‚ñ∂</button><button data-refdel="${i}" title="Delete">üóë</button>`:''}
      </td></tr>`).join('');
    refRows.querySelectorAll('[data-refrec]').forEach(el=>el.addEventListener('click',async()=>{
      const i=+el.dataset.refrec;
      if(refRecIdx===i){ // stop & save
        const blob=await refRec.stop();refRec=null;refRecIdx=-1;
        if(blob&&blob.size>1000)await AudioDB.set(i,blob);
        drawRefRows();return;
      }
      if(refRecIdx>=0){const b=await refRec.stop();if(b&&b.size>1000)await AudioDB.set(refRecIdx,b);refRec=null;refRecIdx=-1;}
      try{refRec=new Recorder();await refRec.start();refRecIdx=i;drawRefRows();}
      catch(e){alert('Microphone not available: '+e.name);refRec=null;refRecIdx=-1;}
    }));
    refRows.querySelectorAll('[data-refplay]').forEach(el=>el.addEventListener('click',async()=>{
      if(playingA){playingA.pause();playingA=null;}
      const blob=await AudioDB.get(+el.dataset.refplay);
      if(blob){playingA=new Audio(URL.createObjectURL(blob));playingA.play();}
    }));
    refRows.querySelectorAll('[data-refdel]').forEach(el=>el.addEventListener('click',async()=>{
      await AudioDB.del(+el.dataset.refdel);drawRefRows();
    }));
  }
  drawRefRows();
  document.getElementById('expPack').addEventListener('click',async()=>{
    const st=document.getElementById('packStatus');st.textContent='Packing‚Ä¶';
    const keys=await AudioDB.keys().catch(()=>[]);
    if(!keys.length){st.textContent='No recordings yet ‚Äî record at least one bracha first.';return;}
    const clips={};
    for(const k of keys){const b=await AudioDB.get(k);if(b)clips[k]={b64:await blobToB64(b),type:b.type||'audio/webm'};}
    const pack={v:1,kind:'se-voice-pack',teacher:S.profile?S.profile.name:'',date:new Date().toISOString().slice(0,10),clips};
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(pack)],{type:'application/json'}));
    a.download='tefillah-voice-pack.json';a.click();
    st.textContent=`Exported ${keys.length} recording(s). Share the file with your students.`;
  });
  document.getElementById('parseCodes').addEventListener('click',()=>{
    const lines=document.getElementById('codes').value.split(/\s+/).filter(x=>x.startsWith('SET1.'));
    rows=lines.map(decodeResult).filter(Boolean);
    const tbl=document.getElementById('tbl');
    if(!rows.length){tbl.innerHTML='<p class="muted">No valid codes found.</p>';return;}
    rows.sort((a,b)=>(b.fl?1:0)-(a.fl?1:0)); // flagged reads first ‚Äî those are the ones to listen to
    tbl.innerHTML=`<table><thead><tr><th>Review?</th><th>Name</th><th>Class</th><th>Bracha</th><th>Score</th><th>WPM</th><th>Date</th><th>Errors</th></tr></thead><tbody>${
      rows.map(r=>`<tr${r.fl?' style="background:var(--warn-bg)"':''}><td title="${esc((r.fr||[]).join('; '))}">${r.fl?'‚öë':''}</td><td>${esc(r.n)}</td><td>${esc(r.c)}</td><td>${r.b}. <span class="heb">${esc(r.bn||'')}</span></td><td><b>${r.a}%</b></td><td>${r.w||'‚Äî'}</td><td>${esc(r.d)}</td><td>${(r.m||[]).length} missed, ${(r.p||[]).length} almost</td></tr>`).join('')
    }</tbody></table>`;
    document.getElementById('csvBtn').style.display='';
  });
  document.getElementById('csvBtn').addEventListener('click',()=>{
    const csv='Ôªø'+['Name,Class,Bracha,Score,WPM,Date,Missed,Almost,TotalWords,Flagged,FlagReasons',
      ...rows.map(r=>[r.n,r.c,r.b+' '+(r.bn||''),r.a,r.w,r.d,(r.m||[]).length,(r.p||[]).length,r.tw,r.fl?'YES':'',(r.fr||[]).join('; ')].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(','))].join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='shemoneh-esrei-results.csv';a.click();
  });
  document.getElementById('thresh').addEventListener('change',e=>{S.settings.masteryPct=Math.max(50,Math.min(100,+e.target.value||90));saveStore();});
}

function confetti(){

  for(let i=0;i<80;i++){

    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.8)+'s';

}

  }
  app.innerHTML=body;
  app.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go({name:el.dataset.go,bracha:view.bracha})));
  if(view.name==='welcome'){
    document.getElementById('pf-go').addEventListener('click',()=>{
      const n=document.getElementById('pf-name').value.trim();
      if(!n){document.getElementById('pf-name').focus();return;}
      S.profile={name:n,cls:document.getElementById('pf-cls').value.trim()};
      saveStore();go({name:'home'});
    });
    document.getElementById('teacherSkip').addEventListener('click',(e)=>{
      e.preventDefault();
      S.profile={name:'Teacher',cls:''};
      S.settings.unlockAll=true;
      saveStore();go({name:'home'});
    });
  }
  if(view.name==='home'){
    app.querySelectorAll('.rung').forEach(el=>{
      const i=+el.dataset.bracha;
      const open=()=>{if(isUnlocked(i))go({name:'bracha',bracha:i});};
      el.addEventListener('click',open);
      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')open();});
    });
  }
  if(view.name==='bracha'){
    app.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>startSession(el.dataset.mode)));
  }
  if(view.name==='session')bindSession();
  if(view.name==='results')bindResults();
  if(view.name==='teacher')bindTeacher();
  if(view.name==='help')bindHelp();
  if(view.name==='settings')bindSettings();
}
render();
</script>
