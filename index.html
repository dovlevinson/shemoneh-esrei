<meta charset="utf-8">
<title>Shemoneh Esrei Reading Coach</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#f6f3ea; --panel:#fffdf7; --panel2:#efe9da; --line:#ddd5c2;
  --ink:#25304e; --ink2:#66708c; --accent:#2456a6; --accent-ink:#ffffff;
  --gold:#a8781c; --gold-bg:#f7ecd2;
  --ok:#187a4b; --ok-bg:#e2f2e7; --warn:#a35d00; --warn-bg:#faedd4; --bad:#b3383e; --bad-bg:#f9e2e3;
  --cur:#2456a6; --cur-bg:#e3ecfa;
  --shadow:0 2px 10px rgba(37,48,78,.08);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131828; --panel:#1c2336; --panel2:#242d45; --line:#333d5c;
    --ink:#e9e7dd; --ink2:#9aa3bd; --accent:#7aa7e8; --accent-ink:#10203c;
    --gold:#d9b45c; --gold-bg:#3a3220;
    --ok:#5ecb93; --ok-bg:#153525; --warn:#eab35e; --warn-bg:#3a2d13; --bad:#f08a8f; --bad-bg:#3d1d20;
    --cur:#7aa7e8; --cur-bg:#22335c;
    --shadow:0 2px 12px rgba(0,0,0,.35);
  }
}
:root[data-theme="light"]{
  --bg:#f6f3ea; --panel:#fffdf7; --panel2:#efe9da; --line:#ddd5c2;
  --ink:#25304e; --ink2:#66708c; --accent:#2456a6; --accent-ink:#ffffff;
  --gold:#a8781c; --gold-bg:#f7ecd2;
  --ok:#187a4b; --ok-bg:#e2f2e7; --warn:#a35d00; --warn-bg:#faedd4; --bad:#b3383e; --bad-bg:#f9e2e3;
  --cur:#2456a6; --cur-bg:#e3ecfa;
  --shadow:0 2px 10px rgba(37,48,78,.08);
}
:root[data-theme="dark"]{
  --bg:#131828; --panel:#1c2336; --panel2:#242d45; --line:#333d5c;
  --ink:#e9e7dd; --ink2:#9aa3bd; --accent:#7aa7e8; --accent-ink:#10203c;
  --gold:#d9b45c; --gold-bg:#3a3220;
  --ok:#5ecb93; --ok-bg:#153525; --warn:#eab35e; --warn-bg:#3a2d13; --bad:#f08a8f; --bad-bg:#3d1d20;
  --cur:#7aa7e8; --cur-bg:#22335c;
  --shadow:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:860px;margin:0 auto;padding:12px 14px 80px}
.heb{font-family:"Frank Ruhl Libre","Frank Ruehl CLM","Times New Roman","Noto Serif Hebrew","SBL Hebrew",David,serif}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--panel2);color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
textarea{width:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin:12px 0}
.muted{color:var(--ink2);font-size:.9em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
h1,h2,h3{text-wrap:balance;margin:.3em 0}
h1{font-size:1.5rem}
h2{font-size:1.2rem}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;background:var(--panel2);color:var(--ink2)}
/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:2px solid var(--line);margin-bottom:10px}
header.top .brand{display:flex;align-items:center;gap:10px}
header.top .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:20px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{padding:7px 13px;border-radius:99px;font-size:.9rem}
nav.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
/* ladder */
.ladder{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rung{position:relative;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel);text-align:center;cursor:pointer;transition:transform .12s}
.rung:hover{transform:translateY(-2px)}
.rung.locked{opacity:.55;cursor:not-allowed;background:var(--panel2)}
.rung.mastered{border-color:var(--gold);background:var(--gold-bg)}
.rung .num{position:absolute;top:6px;left:9px;font-size:.72rem;color:var(--ink2)}
.rung .star{font-size:1.15rem}
.rung .nm{font-weight:700;font-size:1.05rem;margin:4px 0 2px}
.rung .sub{font-size:.75rem;color:var(--ink2)}
.rung .sc{font-size:.8rem;color:var(--ink2)}
/* reading view */
.tefilla{font-size:var(--tsize,2rem);line-height:2.1;text-align:right;direction:rtl}
.phrase{padding:8px 12px;border-radius:12px;margin:4px 0}
.phrase.active{background:var(--cur-bg);box-shadow:inset -3px 0 0 var(--cur)}
.phrase .trans{font-size:.95rem;color:var(--ink2);direction:ltr;text-align:left;line-height:1.4;margin-top:2px;font-family:system-ui,sans-serif}
.w{padding:1px 4px;border-radius:7px;transition:background .15s}
.w.cur{background:var(--cur-bg);box-shadow:0 2px 0 var(--cur)}
@keyframes pulse{50%{opacity:.55}}
.w.cur.listening{animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.w.cur.listening{animation:none}}
.w.ok{background:var(--ok-bg);color:var(--ok)}
.w.warn{background:var(--warn-bg);color:var(--warn)}
.w.bad{background:var(--bad-bg);color:var(--bad);text-decoration:underline wavy var(--bad) 1.5px}
.w.trouble{box-shadow:0 2px 0 var(--warn)}
.notice.sayrule{border-left-color:var(--accent);background:var(--cur-bg)}
/* mic bar */
.micbar{position:sticky;bottom:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;display:flex;gap:12px;align-items:center;margin-top:14px}
.micbtn{width:58px;height:58px;border-radius:50%;font-size:24px;background:var(--accent);color:var(--accent-ink);flex:none}
.micbtn.live{background:var(--bad)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(179,56,62,.45)}100%{box-shadow:0 0 0 16px rgba(179,56,62,0)}}
.micbtn.live{animation:ring 1.2s infinite}
@media (prefers-reduced-motion:reduce){.micbtn.live{animation:none}}
.interim{flex:1;min-height:1.4em;color:var(--ink2);font-size:.95rem;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.interim .hebtxt{direction:rtl;unicode-bidi:isolate}
.livestats{font-variant-numeric:tabular-nums;font-weight:700}
/* score */
.scorewrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bigscore{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)} .fail{color:var(--warn)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel2);border-radius:10px;padding:8px 10px;text-align:center}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--ink2)}
/* mistakes */
.mistake{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--panel2);margin:6px 0;flex-wrap:wrap}
.mistake .exp{font-size:1.5rem;direction:rtl;unicode-bidi:isolate}
.mistake .heard .hebtxt{direction:rtl;unicode-bidi:isolate;font-weight:700}
.dl{color:var(--bad);font-weight:800}
.mistake .why{font-size:.82rem;color:var(--ink2);flex-basis:100%}
/* table */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;font-variant-numeric:tabular-nums}
th{color:var(--ink2);font-weight:600;font-size:.8rem}
/* misc */
.toggles label{display:flex;gap:8px;align-items:center;padding:4px 0}
.center{text-align:center}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);max-width:520px;width:92%}
dialog::backdrop{background:rgba(10,14,25,.45)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;opacity:.9;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.notice{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:10px;margin:10px 0;font-size:.92rem}
.micreport{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;background:var(--panel2);border-radius:10px;padding:12px;margin-top:10px}
footer.src{margin-top:26px;font-size:.75rem;color:var(--ink2);text-align:center}
</style>

<div id="app"></div>

<script>
"use strict";
/* ================= DATA (Nusach Ashkenaz, Sefaria CC-BY Metsudah; phrases/translations: school tefillah curriculum) ================= */

ה","en":"Save us and we will be saved,"},{"t":"כִּי תְהִלָּתֵֽנוּ אָֽתָּה","en":"Because You are the one who we praise."},{"t":"וְהַעֲלֵה רְפוּאָה שְׁלֵמָה לְכָל מַכּוֹתֵֽינוּ","en":"And bring a full healing to all of our sicknesses."}]},{"t":"כִּי אֵל מֶֽלֶךְ רוֹפֵא נֶאֱמָן וְרַחֲמָן אָֽתָּה: בָּרוּךְ אַתָּה יְהֹוָה רוֹפֵא חוֹלֵי עַמּוֹ יִשְׂרָאֵל:","c":"always","ph":[{"t":"כִּי אֵל מֶֽלֶךְ רוֹפֵא נֶאֱמָן וְרַחֲמָן אָֽתָּה:","en":"Because You are a God who is King who is a trustworthy and merciful healer."},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem"},{"t":"רוֹפֵא חוֹלֵי עַמּוֹ יִשְׂרָאֵל:","en":"Who heals the sick of His nation, the Jewish people."}]}]},{"en":"Prosperity","he":"בִּרְכַּת הַשָּׁנִים (בָּרֵךְ עָלֵינוּ)","segs":[{"t":"בָּרֵךְ עָלֵֽינוּ יְהֹוָה אֱלֹהֵֽינוּ אֶת־הַשָּׁנָה הַזֹּאת וְאֶת־כָּל־מִינֵי תְבוּאָתָהּ לְטוֹבָה, וְתֵן","c":"always","ph":[{"t":"בָּרֵךְ עָלֵֽינוּ יְהֹוָה אֱלֹהֵֽינוּ","en":"Hashem our God, bless on us (for us)"},{"t":"אֶת־הַשָּׁנָה הַזֹּאת","en":"This year."},{"t":"וְאֶת־כָּל־מִינֵי תְבוּאָתָהּ לְטוֹבָה,","en":"And all its types of grain for good."},{"t":"וְתֵן","en":"And give dew and rain as a blessing (for good),"}]},{"t":"בְּרָכָה","c":"notwinter"},{"t":"טַל וּמָטָר לִבְרָכָה","c":"winter","ph":[{"t":"טַל וּמָטָר לִבְרָכָה","en":"And give dew and rain as a blessing (for good),"}]},{"t":"עַל פְּנֵי הָאֲדָמָה וְשַׂבְּ֒עֵֽנוּ מִטּוּבֶֽךָ וּבָרֵךְ שְׁנָתֵֽנוּ כַּשָּׁנִים הַטּוֹבוֹת: בָּרוּךְ אַתָּה יְהֹוָה מְבָרֵךְ הַשָּׁנִים:","c":"always","ph":[{"t":"עַל פְּנֵי הָאֲדָמָה","en":"On the face of the ground."},{"t":"וְשַׂבְּ֒עֵֽנוּ מִטּוּבֶֽךָ","en":"And fill us up from your goodness."},{"t":"וּבָרֵךְ שְׁנָתֵֽנוּ כַּשָּׁנִים הַטּוֹבוֹת:","en":"And bless our years, like the good years."},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem"},{"t":"מְבָרֵךְ הַשָּׁנִים:","en":"The one who blesses the years."}]}]},{"en":"Gathering the Exiles","he":"קִבּוּץ גָּלֻיּוֹת (תְּקַע בְּשׁוֹפָר)","segs":[{"t":"תְּקַע בְּשׁוֹפָר גָּדוֹל לְחֵרוּתֵֽנוּ וְשָׂא נֵס לְקַבֵּץ גָּלֻיּוֹתֵֽינוּ וְקַבְּ֒צֵֽנוּ יַֽחַד מֵאַרְבַּע כַּנְפוֹת הָאָֽרֶץ: בָּרוּךְ אַתָּה יְהֹוָה מְקַבֵּץ נִדְחֵי עַמּוֹ יִשְׂרָאֵל:","c":"always","ph":[{"t":"תְּקַע בְּשׁוֹפָר גָּדוֹל לְחֵרוּתֵֽנוּ","en":"Blow a big/great shofar for our saving (when Mashiach comes)"},{"t":"וְשָׂא נֵס","en":"And raise a banner"},{"t":"לְקַבֵּץ גָּלֻיּוֹתֵֽינוּ","en":"To gather our exiles (to Israel when Mashiach comes)."},{"t":"וְקַבְּ֒צֵֽנוּ יַֽחַד","en":"And gather us together"},{"t":"מֵאַרְבַּע כַּנְפוֹת הָאָֽרֶץ:","en":"From the four corners of the land (of the world, to Israel)."},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem"},{"t":"מְקַבֵּץ נִדְחֵי עַמּוֹ יִשְׂרָאֵל:","en":"The one who gathers the scattered of His nation, the Jewish people."}]}]},{"en":"Justice","he":"דִּין (הָשִׁיבָה שׁוֹפְטֵינוּ)","segs":[{"t":"הָשִֽׁיבָה שׁוֹפְ֒טֵֽינוּ כְּבָרִאשׁוֹנָה וְיוֹעֲצֵֽינוּ כְּבַתְּ֒חִלָּה וְהָסֵר מִמֶּֽנּוּ יָגוֹן וַאֲנָחָה וּמְלוֹךְ עָלֵֽינוּ אַתָּה יְהֹוָה לְבַדְּ֒ךָ בְּחֶֽסֶד וּבְרַחֲמִים וְצַדְּ֒קֵֽנוּ בַּמִשְׁפָּט:","c":"always","ph":[{"t":"הָשִֽׁיבָה שׁוֹפְ֒טֵֽינוּ כְּבָרִאשׁוֹנָה","en":"Bring back/return our judges as they were originally (before we were exiled outside of Israel)"},{"t":"וְיוֹעֲצֵֽינוּ כְּבַתְּ֒חִלָּה","en":"And our advisers like they were at first (before we were exiled outside of Israel)."},{"t":"וְהָסֵר מִמֶּֽנּוּ יָגוֹן וַאֲנָחָה","en":"And remove from us sadness and sighing."},{"t":"וּמְלוֹךְ עָלֵֽינוּ אַתָּה יְהֹוָה לְבַדְּ֒ךָ בְּחֶֽסֶד וּבְרַחֲמִים","en":"And you alone, Hashem, will rule over us with kindness and mercy"},{"t":"וְצַדְּ֒קֵֽנוּ בַּמִשְׁפָּט:","en":"And judge us fairly."}]},{"t":"בָּרוּךְ אַתָּה יְהֹוָה מֶֽלֶךְ אֹהֵב צְדָקָה וּמִשְׁפָּט:","c":"notayt","ph":[{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem"},{"t":"מֶֽלֶךְ אֹהֵב צְדָקָה וּמִשְׁפָּט:","en":"King (Hashem) who loves righteousness and judgement"}]},{"t":"בָּרוּךְ אַתָּה יְהֹוָה הַמֶּֽלֶךְ הַמִּשְׁפָּט:","c":"ayt"}]},{"en":"Against Enemies","he":"בִּרְכַּת הַמִּינִים (וְלַמַּלְשִׁינִים)","segs":[{"t":"וְלַמַּלְשִׁינִים אַל תְּהִי תִקְוָה וְכָל הָרִשְׁעָה כְּרֶֽגַע תֹּאבֵד וְכָל אֹיְבֶֽיךָ מְהֵרָה יִכָּרֵֽתוּ וְהַזֵּדִים מְהֵרָה תְעַקֵּר וּתְשַׁבֵּר וּתְמַגֵּר וְתַכְנִֽיעַ בִּמְהֵרָה בְיָמֵֽינוּ: בָּרוּךְ אַתָּה יְהֹוָה שׁוֹבֵר אֹיְ֒בִים וּמַכְנִֽיעַ זֵדִים:","c":"always","ph":[{"t":"וְלַמַּלְשִׁינִים אַל תְּהִי תִקְוָה","en":"And to people who speak badly (about the Jewish people) there should be no hope"},{"t":"וְכָל הָרִשְׁעָה כְּרֶֽגַע תֹּאבֵד","en":"And all wickedness should be destroyed in one moment."},{"t":"וְכָל אֹיְבֶֽיךָ מְהֵרָה יִכָּרֵֽתוּ","en":"And all of your enemies destroy quickly."},{"t":"וְהַזֵּדִים מְהֵרָה","en":"And the enemies of the Jews should quickly"},{"t":"תְעַקֵּר וּתְשַׁבֵּר וּתְמַגֵּר וְתַכְנִֽיעַ","en":"Will be uprooted, broken, crumbled, and humbled"},{"t":"בִּמְהֵרָה בְיָמֵֽינוּ:","en":"Quickly in our days"},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem"},{"t":"שׁוֹבֵר אֹיְ֒בִים וּמַכְנִֽיעַ זֵדִים:","en":"Who breaks enemies and humbles enemies of the Jews"}]}]},{"en":"The Righteous","he":"צַדִּיקִים (עַל הַצַּדִּיקִים)","segs":[{"t":"עַל־הַצַּדִּיקִים וְעַל־הַחֲסִידִים וְעַל־זִקְנֵי עַמְּ֒ךָ בֵּית יִשְׂרָאֵל וְעַל פְּלֵיטַת סוֹפְ֒רֵיהֶם וְעַל גֵּרֵי הַצֶּֽדֶק וְעָלֵֽינוּ יֶהֱמוּ רַחֲמֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וְתֵן שָׂכָר טוֹב לְכָל הַבּוֹטְ֒חִים בְּשִׁמְךָ בֶּאֱמֶת וְשִׂים חֶלְקֵֽנוּ עִמָּהֶם לְעוֹלָם וְלֹא נֵבוֹשׁ כִּי בְךָ בָּטָֽחְנוּ: בָּרוּךְ אַתָּה יְהֹוָה מִשְׁעָן וּמִבְטָח לַצַּדִּיקִים:","c":"always","ph":[{"t":"עַל־הַצַּדִּיקִים וְעַל־הַחֲסִידִים","en":"On the saintly and righteous people"},{"t":"וְעַל־זִקְנֵי עַמְּ֒ךָ בֵּית יִשְׂרָאֵל","en":"And on the elders of the Jewish people"},{"t":"וְעַל פְּלֵיטַת סוֹפְ֒רֵיהֶם","en":"And on the remainder of their Torah scholars"},{"t":"וְעַל גֵּרֵי הַצֶּֽדֶק","en":"And on the righteous converts"},{"t":"וְעָלֵֽינוּ","en":"And on us"},{"t":"יֶהֱמוּ רַחֲמֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ","en":"Give your mercy Hashem our God"},{"t":"וְתֵן שָׂכָר טוֹב לְכָל הַבּוֹטְ֒חִים בְּשִׁמְךָ בֶּאֱמֶת","en":"And give good reward for all of those who truthfully rely on Your name"},{"t":"וְשִׂים חֶלְקֵֽנוּ עִמָּהֶם לְעוֹלָם","en":"And put our portion with them forever (we should be with them in Olam haBa)"},{"t":"וְלֹא נֵבוֹשׁ כִּי בְךָ בָּטָֽחְנוּ:","en":"And we should never be embarrassed because we have relied on You."},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem"},{"t":"מִשְׁעָן וּמִבְטָח לַצַּדִּיקִים:","en":"The one who supports, and is trusted by, the righteous."}]}]},{"en":"Rebuilding Jerusalem","he":"בִּנְיַן יְרוּשָׁלַיִם (וְלִירוּשָׁלַיִם)","segs":[{"t":"וְלִירוּשָׁלַֽיִם עִירְ֒ךָ בְּרַחֲמִים תָּשׁוּב וְתִשְׁכּוֹן בְּתוֹכָהּ כַּאֲשֶׁר דִּבַּֽרְתָּ וּבְנֵה אוֹתָהּ בְּקָרוֹב בְּיָמֵֽינוּ בִּנְיַן עוֹלָם וְכִסֵּא דָוִד מְהֵרָה לְתוֹכָהּ תָּכִין: בָּרוּךְ אַתָּה יְהֹוָה בּוֹנֵה יְרוּשָׁלָֽיִם:","c":"always","ph":[{"t":"וְלִירוּשָׁלַֽיִם עִירְ֒ךָ בְּרַחֲמִים תָּשׁוּב","en":"Return to Yerushalayim (and build the Beit haMikdash) with mercy"},{"t":"וְתִשְׁכּוֹן בְּתוֹכָהּ כַּאֲשֶׁר דִּבַּֽרְתָּ","en":"And live there (in the Beit haMikdash) as You said (in Tanach)"},{"t":"וּבְנֵה אוֹתָהּ בְּקָרוֹב בְּיָמֵֽינוּ בִּנְיַן עוֹלָם","en":"And build it (Yerushalayim and the Beit haMikdash) quickly in our day, as a building which lasts forever"},{"t":"וְכִסֵּא דָוִד מְהֵרָה לְתוֹכָהּ תָּכִין:","en":"And establish the chair of (Mashiach, a descendant of King) David, quickly."},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem"},{"t":"בּוֹנֵה יְרוּשָׁלָֽיִם:","en":"The one who builds Yerushalayim"}]}]},{"en":"Kingdom of David","he":"מַלְכוּת בֵּית דָּוִד (אֶת צֶמַח)","segs":[{"t":"אֶת־צֶֽמַח דָּוִד עַבְדְּ֒ךָ מְהֵרָה תַצְמִֽיחַ וְקַרְנוֹ תָּרוּם בִּישׁוּעָתֶֽךָ כִּי לִישׁוּעָתְ֒ךָ קִוִּֽינוּ כָּל הַיּוֹם: בָּרוּךְ אַתָּה יְהֹוָה מַצְמִֽיחַ קֶֽרֶן יְשׁוּעָה:","c":"always","ph":[{"t":"אֶת־צֶֽמַח דָּוִד עַבְדְּ֒ךָ מְהֵרָה תַצְמִֽיחַ","en":"You (Hashem) should cause the sprouting of (King) David, Your servant, to quickly begin to grow (Mashiach should come soon)"},{"t":"וְקַרְנוֹ תָּרוּם בִּישׁוּעָתֶֽךָ","en":"And raise up his (King David’s) power through your saving (by bringing Mashiach)"},{"t":"כִּי לִישׁוּעָתְ֒ךָ קִוִּֽינוּ כָּל הַיּוֹם:","en":"Because we constantly hope for your redemption"},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem"},{"t":"מַצְמִֽיחַ קֶֽרֶן יְשׁוּעָה:","en":"Who causes the power of redemption to sprout (He causes Mashiach to come)"}]}]},{"en":"Response to Prayer","he":"שׁוֹמֵעַ תְּפִלָּה (שְׁמַע קוֹלֵנוּ)","segs":[{"t":"שְׁמַע קוֹלֵֽנוּ יְהֹוָה אֱלֹהֵֽינוּ חוּס וְרַחֵם עָלֵֽינוּ וְקַבֵּל בְּרַחֲמִים וּבְרָצוֹן אֶת־תְּפִלָּתֵֽנוּ כִּי אֵל שׁוֹמֵֽעַ תְּפִלּוֹת וְתַחֲנוּנִים אָֽתָּה וּמִלְּ֒פָנֶֽיךָ מַלְכֵּֽנוּ רֵיקָם אַל־תְּשִׁיבֵֽנוּ כִּי אַתָּה שׁוֹמֵֽעַ תְּפִלַּת עַמְּ֒ךָ יִשְׂרָאֵל בְּרַחֲמִים: בָּרוּךְ אַתָּה יְהֹוָה שׁוֹמֵֽעַ תְּפִלָּה:","c":"always","ph":[{"t":"שְׁמַע קוֹלֵֽנוּ יְהֹוָה אֱלֹהֵֽינוּ","en":"Hear our voice Hashem our God"},{"t":"חוּס וְרַחֵם עָלֵֽינוּ","en":"Spare us and have mercy on us"},{"t":"וְקַבֵּל בְּרַחֲמִים וּבְרָצוֹן אֶת־תְּפִלָּתֵֽנוּ","en":"And with mercy and desire, accept our prayers"},{"t":"כִּי אֵל שׁוֹמֵֽעַ תְּפִלּוֹת וְתַחֲנוּנִים אָֽתָּה","en":"Because you are God who listens to our prayers and requests"},{"t":"וּמִלְּ֒פָנֶֽיךָ מַלְכֵּֽנוּ רֵיקָם אַל־תְּשִׁיבֵֽנוּ","en":"And from before You, our king, do not turn us away empty-handed,"},{"t":"כִּי אַתָּה שׁוֹמֵֽעַ תְּפִלַּת עַמְּ֒ךָ יִשְׂרָאֵל בְּרַחֲמִים:","en":"Because you listen to the prayers of the Jewish nation with mercy."},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem"},{"t":"שׁוֹמֵֽעַ תְּפִלָּה:","en":"Who listens to prayers."}]}]},{"en":"Temple Service","he":"עֲבוֹדָה (רְצֵה)","segs":[{"t":"רְצֵה יְהֹוָה אֱלֹהֵֽינוּ בְּעַמְּ֒ךָ יִשְׂרָאֵל וּבִתְפִלָּתָם וְהָשֵׁב אֶת הָעֲבוֹדָה לִדְבִיר בֵּיתֶֽךָ וְאִשֵּׁי יִשְׂרָאֵל וּתְפִלָּתָם בְּאַהֲבָה תְקַבֵּל בְּרָצוֹן וּתְהִי לְרָצוֹן תָּמִיד עֲבוֹדַת יִשְׂרָאֵל עַמֶּֽךָ:","c":"always","ph":[{"t":"רְצֵה יְהֹוָה אֱלֹהֵֽינוּ בְּעַמְּ֒ךָ יִשְׂרָאֵל וּבִתְפִלָּתָם","en":"Hashem our God, desire the prayers of, your nation, the Jewish people"},{"t":"וְהָשֵׁב אֶת הָעֲבוֹדָה לִדְבִיר בֵּיתֶֽךָ וְאִשֵּׁי יִשְׂרָאֵל","en":"And return the service and the korbanot to the holy place of Your house (the Beit haMikdash)."},{"t":"וּתְפִלָּתָם בְּאַהֲבָה תְקַבֵּל בְּרָצוֹן","en":"And accept their prayers (in the Beit haMikdash) with love and with desire."},{"t":"וּתְהִי לְרָצוֹן תָּמִיד עֲבוֹדַת יִשְׂרָאֵל עַמֶּֽךָ:","en":"And the service of Your nation, the Jews, should always be a desire for You."}]},{"t":"אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ יַעֲלֶה וְיָבֹא וְיַגִּֽיעַ וְיֵרָאֶה וְיֵרָצֶה וְיִשָּׁמַע וְיִפָּקֵד וְיִזָּכֵר זִכְרוֹנֵֽנוּ וּפִקְדוֹנֵֽנוּ וְזִכְרוֹן אֲבוֹתֵֽינוּ. וְזִכְרוֹן מָשִֽׁיחַ בֶּן דָּוִד עַבְדֶּֽךָ. וְזִכְרוֹן יְרוּשָׁלַֽיִם עִיר קָדְשֶֽׁךָ. וְזִכְרוֹן כָּל עַמְּ֒ךָ בֵּית יִשְׂרָאֵל לְפָנֶֽיךָ. לִפְלֵיטָה לְטוֹבָה לְחֵן וּלְחֶֽסֶד וּלְרַחֲמִים לְחַיִּים וּלְשָׁלוֹם. בְּיוֹם רֹאשׁ הַחֹֽדֶשׁ הַזֶּה: חַג הַמַּצּוֹת הַזֶּה: חַג הַסֻּכּוֹת הַזֶּה: זָכְרֵֽנוּ יְהֹוָה אֱלֹהֵֽינוּ בּוֹ לְטוֹבָה. וּפָקְדֵֽנוּ בוֹ לִבְרָכָה. וְהוֹשִׁיעֵֽנוּ בוֹ לְחַיִּים. וּבִדְבַר יְשׁוּעָה וְרַחֲמִים חוּס וְחָנֵּֽנוּ וְרַחֵם עָלֵֽינוּ וְהוֹשִׁיעֵֽנוּ. כִּי אֵלֶֽיךָ עֵינֵֽינוּ כִּי אֵל מֶֽלֶךְ חַנּוּן וְרַחוּם אָֽתָּה:","c":"rc","ph":[{"t":"אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ יַעֲלֶה וְיָבֹא וְיַגִּֽיעַ וְיֵרָאֶה וְיֵרָצֶה וְיִשָּׁמַע וְיִפָּקֵד וְיִזָּכֵר זִכְרוֹנֵֽנוּ וּפִקְדוֹנֵֽנוּ וְזִכְרוֹן אֲבוֹתֵֽינוּ. וְזִכְרוֹן מָשִֽׁיחַ בֶּן דָּוִד עַבְדֶּֽךָ. וְזִכְרוֹן יְרוּשָׁלַֽיִם עִיר קָדְשֶֽׁךָ. וְזִכְרוֹן כָּל עַמְּ֒ךָ בֵּית יִשְׂרָאֵל לְפָנֶֽיךָ. לִפְלֵיטָה לְטוֹבָה לְחֵן וּלְחֶֽסֶד וּלְרַחֲמִים לְחַיִּים וּלְשָׁלוֹם. בְּיוֹם רֹאשׁ הַחֹֽדֶשׁ הַזֶּה: חַג הַמַּצּוֹת הַזֶּה: חַג הַסֻּכּוֹת הַזֶּה: זָכְרֵֽנוּ יְהֹוָה אֱלֹהֵֽינוּ בּוֹ לְטוֹבָה. וּפָקְדֵֽנוּ בוֹ לִבְרָכָה. וְהוֹשִׁיעֵֽנוּ בוֹ לְחַיִּים. וּבִדְבַר יְשׁוּעָה וְרַחֲמִים חוּס וְחָנֵּֽנוּ וְרַחֵם עָלֵֽינוּ וְהוֹשִׁיעֵֽנוּ. כִּי אֵלֶֽיךָ","en":null},{"t":"עֵינֵֽינוּ","en":"And our eyes should see when You return to Yerushalayim (when the Beit haMikdash is rebuilt) with mercy."},{"t":"כִּי אֵל מֶֽלֶךְ חַנּוּן וְרַחוּם אָֽתָּה:","en":null}]},{"t":"וְתֶחֱזֶֽינָה עֵינֵֽינוּ בְּשׁוּבְ֒ךָ לְצִיּוֹן בְּרַחֲמִים: בָּרוּךְ אַתָּה יְהֹוָה הַמַּחֲזִיר שְׁכִינָתוֹ לְצִיּוֹן:","c":"always","ph":[{"t":"וְתֶחֱזֶֽינָה עֵינֵֽינוּ","en":null},{"t":"בְּשׁוּבְ֒ךָ לְצִיּוֹן בְּרַחֲמִים:","en":"And our eyes should see when You return to Yerushalayim (when the Beit haMikdash is rebuilt) with mercy."},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You Hashem,"},{"t":"הַמַּחֲזִיר שְׁכִינָתוֹ לְצִיּוֹן:","en":"The One who returns His Godly presence to Yerushalayim."}]}]},{"en":"Thanksgiving","he":"הוֹדָאָה (מוֹדִים)","segs":[{"t":"מוֹדִים אֲנַֽחְנוּ לָךְ שָׁאַתָּה הוּא יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ לְעוֹלָם וָעֶד צוּר חַיֵּֽינוּ מָגֵן יִשְׁעֵֽנוּ אַתָּה הוּא לְדוֹר וָדוֹר נֽוֹדֶה לְּךָ וּנְסַפֵּר תְּהִלָּתֶֽךָ עַל־חַיֵּֽינוּ הַמְּ֒סוּרִים בְּיָדֶֽךָ וְעַל נִשְׁמוֹתֵֽינוּ הַפְּ֒קוּדוֹת לָךְ וְעַל נִסֶּֽיךָ שֶׁבְּכָל יוֹם עִמָּֽנוּ וְעַל נִפְלְ֒אוֹתֶֽיךָ וְטוֹבוֹתֶֽיךָ שֶׁבְּ֒כָל עֵת עֶֽרֶב וָבֹֽקֶר וְצָהֳרָֽיִם הַטּוֹב כִּי לֹא כָלוּ רַחֲמֶֽיךָ וְהַמְ֒רַחֵם כִּי לֹא תַֽמּוּ חֲסָדֶֽיךָ מֵעוֹלָם קִוִּֽינוּ לָךְ:","c":"always","ph":[{"t":"מוֹדִים אֲנַֽחְנוּ לָךְ","en":"We thank You"},{"t":"שָׁאַתָּה הוּא יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ לְעוֹלָם וָעֶד","en":"For You are our God, and the God of our forefathers (the avot), forever."},{"t":"צוּר חַיֵּֽינוּ","en":"Rock of our life,"},{"t":"מָגֵן יִשְׁעֵֽנוּ","en":"Shield of our saving,"},{"t":"אַתָּה הוּא","en":"You exist for all time (from generation to generation)."},{"t":"לְדוֹר וָדוֹר","en":null},{"t":"נֽוֹדֶה לְּךָ וּנְסַפֵּר תְּהִלָּתֶֽךָ","en":"We thank You, and we say Your praises,"},{"t":"עַל־חַיֵּֽינוּ הַמְּ֒סוּרִים בְּיָדֶֽךָ","en":"For our life which are placed in Your hands,"},{"t":"וְעַל נִשְׁמוֹתֵֽינוּ הַפְּ֒קוּדוֹת לָךְ","en":"And for our souls which is entrusted to You,"},{"t":"וְעַל נִסֶּֽיךָ שֶׁבְּכָל יוֹם עִמָּֽנוּ","en":"And for Your miracles that are with us every day,"},{"t":"וְעַל נִפְלְ֒אוֹתֶֽיךָ וְטוֹבוֹתֶֽיךָ","en":"And for Your miracles and goodness,"},{"t":"שֶׁבְּ֒כָל עֵת","en":"that are present at all times"},{"t":"עֶֽרֶב וָבֹֽקֶר וְצָהֳרָֽיִם","en":"Evening, morning, and afternoon."},{"t":"הַטּוֹב כִּי לֹא כָלוּ רַחֲמֶֽיךָ","en":"(You are) The good one, because Your mercy is not finished,"},{"t":"וְהַמְ֒רַחֵם כִּי לֹא תַֽמּוּ חֲסָדֶֽיךָ","en":"And the merciful one, because Your kindnesses are not ended,"},{"t":"מֵעוֹלָם קִוִּֽינוּ לָךְ:","en":"We have hoped in You forever."}]},{"t":"עַל הַנִּסִּים וְעַל הַפֻּרְקָן וְעַל הַגְּ֒בוּרוֹת וְעַל הַתְּ֒שׁוּעוֹת וְעַל הַמִּלְחָמוֹת שֶׁעָשִֽׂיתָ לַאֲבוֹתֵֽינוּ בַּיָּמִים הָהֵם בַּזְּ֒מַן הַזֶּה:","c":"nissim","ph":[{"t":"עַל","en":"And for all of these (we thank You for)"},{"t":"הַנִּסִּים וְעַל הַפֻּרְקָן וְעַל הַגְּ֒בוּרוֹת וְעַל הַתְּ֒שׁוּעוֹת וְעַל הַמִּלְחָמוֹת שֶׁעָשִֽׂיתָ לַאֲבוֹתֵֽינוּ בַּיָּמִים הָהֵם בַּזְּ֒מַן הַזֶּה:","en":null}]},{"t":"בִּימֵי מַתִּתְיָֽהוּ בֶּן יוֹחָנָן כֹּהֵן גָּדוֹל חַשְׁמוֹנָאִי וּבָנָיו כְּשֶׁעָמְ֒דָה מַלְכוּת יָוָן הָרְ֒שָׁעָה עַל־עַמְּ֒ךָ יִשְׂרָאֵל לְהַשְׁכִּיחָם תּוֹרָתֶֽךָ וּלְהַעֲבִירָם מֵחֻקֵּי רְצוֹנֶֽךָ, וְאַתָּה בְּרַחֲמֶֽיךָ הָרַבִּים עָמַֽדְתָּ לָהֶם בְּעֵת צָרָתָם רַֽבְתָּ אֶת־רִיבָם דַּֽנְתָּ אֶת־דִּינָם נָקַֽמְתָּ אֶת־נִקְמָתָם מָסַֽרְתָּ גִבּוֹרִים בְּיַד חַלָּשִׁים וְרַבִּים בְּיַד מְעַטִּים וּטְמֵאִים בְּיַד טְהוֹרִים וּרְשָׁעִים בְּיַד צַדִּיקִים וְזֵדִים בְּיַד עוֹסְ֒קֵי תוֹרָתֶֽךָ וּלְךָ עָשִֽׂיתָ שֵׁם גָּדוֹל וְקָדוֹשׁ בְּעוֹלָמֶֽךָ וּלְעַמְּ֒ךָ יִשְׂרָאֵל עָשִֽׂיתָ תְּשׁוּעָה גְדוֹלָה וּפֻרְקָן כְּהַיּוֹם הַזֶּה וְאַחַר־כֵּן בָּֽאוּ בָנֶֽיךָ לִדְבִיר בֵּיתֶֽךָ וּפִנּוּ אֶת־הֵיכָלֶֽךָ וְטִהֲרוּ אֶת־מִקְדָּשֶֽׁךָ וְהִדְלִֽיקוּ נֵרוֹת בְּחַצְרוֹת קָדְשֶֽׁךָ וְקָבְ֒עוּ שְׁמוֹנַת יְמֵי חֲנֻכָּה אֵֽלּוּ לְהוֹדוֹת וּלְהַלֵּל לְשִׁמְךָ הַגָּדוֹל:","c":"chanukah"},{"t":"בִּימֵי מָרְדְּ֒כַי וְאֶסְתֵּר בְּשׁוּשַׁן הַבִּירָה כְּשֶׁעָמַד עֲלֵיהֶם הָמָן הָרָשָׁע בִּקֵּשׁ לְהַשְׁמִיד לַהֲרוֹג וּלְאַבֵּד אֶת־כָּל־הַיְּ֒הוּדִים מִנַּֽעַר וְעַד־זָקֵן טַף וְנָשִׁים בְּיוֹם אֶחָד בִּשְׁלוֹשָׁה עָשָׂר לְחֹֽדֶשׁ שְׁנֵים־עָשָׂר הוּא־חֹֽדֶשׁ אֲדָר וּשְׁלָלָם לָבוֹז: וְאַתָּה בְּרַחֲמֶֽיךָ הָרַבִּים הֵפַֽרְתָּ אֶת־עֲצָתוֹ וְקִלְקַֽלְתָּ אֶת־מַחֲשַׁבְתּוֹ וַהֲשֵׁבֽוֹתָ לּוֹ גְּמוּלוֹ בְּרֹאשׁוֹ וְתָלוּ אוֹתוֹ וְאֶת־בָּנָיו עַל־הָעֵץ (וְעָשִׂיתָ עִמָּהֶם נֵס וָפֶלֶא וְנוֹדֶה לְשִׁמְךָ הָגָּדוֹל סֶלָה):","c":"purim"},{"t":"וְעַל־כֻּלָּם יִתְבָּרַךְ וְיִתְרוֹמַם שִׁמְךָ מַלְכֵּֽנוּ תָּמִיד לְעוֹלָם וָעֶד:","c":"always","ph":[{"t":"וְעַל־כֻּלָּם","en":null},{"t":"יִתְבָּרַךְ וְיִתְרוֹמַם שִׁמְךָ מַלְכֵּֽנוּ תָּמִיד לְעוֹלָם וָעֶד:","en":"May Your name, our King, be blessed and raised up forever and ever"}]},{"t":"וּכְתוֹב לְחַיִּים טוֹבִים כָּל בְּנֵי בְרִיתֶֽךָ:","c":"ayt","ph":[{"t":"וּכְתוֹב לְחַיִּים טוֹבִים","en":null},{"t":"כָּל","en":"And all the living will thank You, always,"},{"t":"בְּנֵי בְרִיתֶֽךָ:","en":null}]},{"t":"וְכֹל הַחַיִּים יוֹדֽוּךָ סֶּֽלָה וִיהַלְ֒לוּ אֶת־שִׁמְךָ בֶּאֱמֶת הָאֵל יְשׁוּעָתֵֽנוּ וְעֶזְרָתֵֽנוּ סֶֽלָה: בָּרוּךְ אַתָּה יְהֹוָה הַטּוֹב שִׁמְךָ וּלְךָ נָאֶה לְהוֹדוֹת:","c":"always","ph":[{"t":"וְכֹל","en":null},{"t":"הַחַיִּים יוֹדֽוּךָ סֶּֽלָה","en":"And all the living will thank You, always,"},{"t":"וִיהַלְ֒לוּ אֶת־שִׁמְךָ בֶּאֱמֶת","en":"And they will praise Your name with truth,"},{"t":"הָאֵל יְשׁוּעָתֵֽנוּ וְעֶזְרָתֵֽנוּ סֶֽלָה:","en":"The God who is our salvation and our help, always."},{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You, Hashem,"},{"t":"הַטּוֹב שִׁמְךָ וּלְךָ נָאֶה לְהוֹדוֹת:","en":"Your name is good, and to You it is fitting to give thanks."}]}]},{"en":"Peace","he":"שָׁלוֹם (שִׂים שָׁלוֹם)","segs":[{"t":"שִׂים שָׁלוֹם טוֹבָה וּבְרָכָה חֵן וָחֶֽסֶד וְרַחֲמִים עָלֵֽינוּ וְעַל כָּל־יִשְׂרָאֵל עַמֶּֽךָ. בָּרְ֒כֵֽנוּ אָבִֽינוּ כֻּלָּֽנוּ כְּאֶחָד בְּאוֹר פָּנֶֽיךָ. כִּי בְאוֹר פָּנֶֽיךָ נָתַֽתָּ לָּֽנוּ יְהֹוָה אֱלֹהֵֽינוּ תּוֹרַת חַיִּים וְאַהֲבַת חֶֽסֶד וּצְדָקָה וּבְרָכָה וְרַחֲמִים וְחַיִּים וְשָׁלוֹם. וְטוֹב בְּעֵינֶֽיךָ לְבָרֵךְ אֶת עַמְּ֒ךָ יִשְׂרָאֵל בְּכָל־עֵת וּבְכָל־שָׁעָה בִּשְׁלוֹמֶֽךָ:","c":"always","ph":[{"t":"שִׂים שָׁלוֹם","en":"Put peace"},{"t":"טוֹבָה וּבְרָכָה חֵן וָחֶֽסֶד וְרַחֲמִים","en":"Goodness, and blessing, favor, and kindness, and mercy,"},{"t":"עָלֵֽינוּ וְעַל כָּל־יִשְׂרָאֵל עַמֶּֽךָ.","en":"On us, and on all of the Jewish people, Your nation."},{"t":"בָּרְ֒כֵֽנוּ אָבִֽינוּ כֻּלָּֽנוּ כְּאֶחָד בְּאוֹר פָּנֶֽיךָ.","en":"Bless us, our Father, all of us as one, with the light of Your face."},{"t":"כִּי בְאוֹר פָּנֶֽיךָ נָתַֽתָּ לָּֽנוּ יְהֹוָה אֱלֹהֵֽינוּ","en":"Because in the light of Your face You gave to us, Hashem our God,"},{"t":"תּוֹרַת חַיִּים וְאַהֲבַת חֶֽסֶד","en":"The living Torah, and the love of kindness."},{"t":"וּצְדָקָה וּבְרָכָה וְרַחֲמִים וְחַיִּים וְשָׁלוֹם.","en":"And charity, and blessing, and mercy, and life, and peace,"},{"t":"וְטוֹב בְּעֵינֶֽיךָ לְבָרֵךְ אֶת עַמְּ֒ךָ יִשְׂרָאֵל","en":"And may it be good in Your eyes to bless Your people, the Jewish people,"},{"t":"בְּכָל־עֵת וּבְכָל־שָׁעָה בִּשְׁלוֹמֶֽךָ:","en":"At every time and hour, in Your peace."}]},{"t":"בְּסֵֽפֶר חַיִּים בְּרָכָה וְשָׁלוֹם וּפַרְנָסָה טוֹבָה נִזָּכֵר וְנִכָּתֵב לְפָנֶֽיךָ אֲנַֽחְנוּ וְכָל עַמְּ֒ךָ בֵּית יִשְׂרָאֵל לְחַיִּים טוֹבִים וּלְשָׁלוֹם:","c":"ayt"},{"t":"בָּרוּךְ אַתָּה יְהֹוָה הַמְ֒בָרֵךְ אֶת־עַמּוֹ יִשְׂרָאֵל בַּשָּׁלוֹם:","c":"always","ph":[{"t":"בָּרוּךְ אַתָּה יְהֹוָה","en":"Blessed are You, Hashem"},{"t":"הַמְ֒בָרֵךְ אֶת־עַמּוֹ יִשְׂרָאֵל בַּשָּׁלוֹם:","en":"The one who blesses His nation, the Jewish people, with peace"}]}]},{"en":"Concluding Passage","he":"אֱלֹהַי נְצֹר + עֹשֶׂה שָׁלוֹם","segs":[{"t":"יִהְיוּ לְרָצוֹן אִמְרֵי פִי וְהֶגְיוֹן לִבִּי לְפָנֶֽיךָ יְהֹוָה צוּרִי וְגוֹאֲלִי:","c":"always"},{"t":"אֱלֹהַי נְצוֹר לְשׁוֹנִי מֵרָע וּשְׂפָתַי מִדַּבֵּר מִרְמָה. וְלִמְקַלְ֒לַי נַפְשִׁי תִדּוֹם וְנַפְשִׁי כֶּעָפָר לַכֹּל תִּהְיֶה. פְּתַח לִבִּי בְּתוֹרָתֶֽךָ וּבְמִצְוֹתֶֽיךָ תִּרְדֹּף נַפְשִׁי. וְכֹל הַחוֹשְׁ֒בִים עָלַי רָעָה מְהֵרָה הָפֵר עֲצָתָם וְקַלְקֵל מַחֲשַׁבְתָּם: עֲשֵׂה לְמַֽעַן שְׁמֶֽךָ עֲשֵׂה לְמַֽעַן יְמִינֶֽךָ עֲשֵׂה לְמַֽעַן קְדֻשָּׁתֶֽךָ עֲשֵׂה לְמַֽעַן תּוֹרָתֶֽךָ. לְמַֽעַן יֵחָלְ֒צוּן יְדִידֶֽיךָ הוֹשִֽׁיעָה יְמִינְ֒ךָ וַעֲנֵֽנִי: יִהְיוּ לְרָצוֹן אִמְרֵי פִי וְהֶגְיוֹן לִבִּי לְפָנֶֽיךָ יְהֹוָה צוּרִי וְגוֹאֲלִי:","c":"always","ph":[{"t":"אֱלֹהַי","en":"My God,"},{"t":"נְצוֹר לְשׁוֹנִי מֵרָע וּשְׂפָתַי מִדַּבֵּר מִרְמָה.","en":"Guard my tongue from bad, and my lips from speaking dishonestly."},{"t":"וְלִמְקַלְ֒לַי נַפְשִׁי תִדּוֹם","en":"And to those who curse me, my soul should be silent (I should be humble and not respond)."},{"t":"וְנַפְשִׁי כֶּעָפָר לַכֹּל תִּהְיֶה.","en":"And my soul should be like dirt (humble) to all."},{"t":"פְּתַח לִבִּי בְּתוֹרָתֶֽךָ וּבְמִצְוֹתֶֽיךָ תִּרְדֹּף נַפְשִׁי.","en":"Open my heart in Your Torah, and may my soul run after your mitzvot."},{"t":"וְכֹל הַחוֹשְׁ֒בִים עָלַי רָעָה","en":"And all those who think bad on me (about me),"},{"t":"מְהֵרָה הָפֵר עֲצָתָם וְקַלְקֵל מַחֲשַׁבְתָּם:","en":"Quickly You should cancel their ideas, and ruin their thoughts."},{"t":"עֲשֵׂה לְמַֽעַן שְׁמֶֽךָ","en":"You should do this for the sake of Your name,"},{"t":"עֲשֵׂה לְמַֽעַן יְמִינֶֽךָ","en":"You should do this for the sake of Your right hand,"},{"t":"עֲשֵׂה לְמַֽעַן קְדֻשָּׁתֶֽךָ","en":"You should do this for the sake of Your holiness,"},{"t":"עֲשֵׂה לְמַֽעַן תּוֹרָתֶֽךָ.","en":"You should do this for the sake of Your Torah."},{"t":"לְמַֽעַן יֵחָלְ֒צוּן יְדִידֶֽיךָ","en":"So that they those who who You love (the Jewish people) should be rescued,"},{"t":"הוֹשִֽׁיעָה יְמִינְ֒ךָ וַעֲנֵֽנִי:","en":"Your right hand should save and answer me."},{"t":"יִהְיוּ לְרָצוֹן אִמְרֵי פִי וְהֶגְיוֹן לִבִּי לְפָנֶֽיךָ","en":"Let the words of my mouth and the thoughts of my heart be desired and accepted before you,"},{"t":"יְהֹוָה צוּרִי וְגוֹאֲלִי:","en":"Hashem, my rock and my redeemer"}]},{"t":"עֹשֶׂה ( הַשָּׁלוֹם) שָׁלוֹם בִּמְרוֹמָיו הוּא יַעֲשֶׂה שָׁלוֹם עָלֵֽינוּ וְעַל כָּל־יִשְׂרָאֵל וְאִמְרוּ אָמֵן:","c":"always","ph":[{"t":"עֹשֶׂה הַשָּׁלוֹם)","en":"He who makes peace in heaven,"},{"t":"שָׁלוֹם","en":null},{"t":"בִּמְרוֹמָיו","en":"He who makes peace in heaven,"},{"t":"הוּא יַעֲשֶׂה שָׁלוֹם","en":"He should make peace,"},{"t":"עָלֵֽינוּ וְעַל כָּל־יִשְׂרָאֵל","en":"On us and on all of the Jewish people,"},{"t":"וְאִמְרוּ אָמֵן:","en":"And you should say Amen (“I agree”)."}]},{"t":"יְהִי רָצוֹן מִלְּ֒פָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ שֶׁיִּבָּנֶה בֵּית הַמִּקְדָּשׁ בִּמְהֵרָה בְיָמֵֽינוּ וְתֵן חֶלְקֵֽנוּ בְּתוֹרָתֶֽךָ: וְשָׁם נַעֲבָדְךָ בְּיִרְאָה כִּימֵי עוֹלָם וּכְשָׁנִים קַדְמוֹנִיּוֹת: וְעָרְ֒בָה לַיהוָֹה מִנְחַת יְהוּדָה וִירוּשָׁלָֽםִ כִּימֵי עוֹלָם וּכְשָׁנִים קַדְמוֹנִיּוֹת:","c":"always","ph":[{"t":"יְהִי רָצוֹן מִלְּ֒פָנֶֽיךָ יְהֹוָה אֱלֹהֵֽינוּ וֵאלֹהֵי אֲבוֹתֵֽינוּ","en":"It should be Your desire, Hashem our God and the God of our fathers,"},{"t":"שֶׁיִּבָּנֶה בֵּית הַמִּקְדָּשׁ בִּמְהֵרָה בְיָמֵֽינוּ","en":"That the Beit haMikdash should be rebuilt quickly in our day"},{"t":"וְתֵן חֶלְקֵֽנוּ בְּתוֹרָתֶֽךָ:","en":"And You should give us our portion in Your Torah,"},{"t":"וְשָׁם נַעֲבָדְךָ בְּיִרְאָה","en":"And there we will worship you with fear/awe,"},{"t":"כִּימֵי עוֹלָם וּכְשָׁנִים קַדְמוֹנִיּוֹת:","en":"Like in the days from the past and in earlier years (earlier generations, when the Beit haMikdash was built)."},{"t":"וְעָרְ֒בָה","en":"And the gifts (korbanot) of the Jewish and Yerushalayim should be sweet to Hashem,"},{"t":"לַיהוָֹה","en":null},{"t":"מִנְחַת יְהוּדָה וִירוּשָׁלָֽםִ","en":"And the gifts (korbanot) of the Jewish and Yerushalayim should be sweet to Hashem,"},{"t":"כִּימֵי עוֹלָם וּכְשָׁנִים קַדְמוֹנִיּוֹת:","en":"Like in the days from the past and in earlier years (earlier generations, when the Beit h /* ================= text utils & engine ================= */
const FINALS={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function norm(w){ // vocalized or plain word -> bare letters
  let s=(w||'').replace(/[^א-ת]/g,'');
  s=s.replace(/[ךםןףץ]/g,c=>FINALS[c]);
  return s;
}
function normTranscript(w){
  // Hashem abbreviations the speech model commonly emits -> the spelled Name, so
  // the divine slot matches. Detect the geresh/apostrophe BEFORE norm() strips it;
  // a BARE ה (no mark) still won't pass, keeping the anti-false-match guard intact.
  const bare=(w||'').replace(/[֑-ׇ]/g,'');   // drop nikud/taamim, keep letters + marks
  if(/^ה['׳’][^א-ת]*$/.test(bare))return 'יהוה'; // standalone ה' / ה׳ (not ה' glued to a following word)
  let s=norm(w);
  if(s==='יי')return 'יהוה';        // double-yod abbreviation (יְיָ)
  s=s.replace(/אלו?ק/g,'אלה');     // Elokim-spellings (אלוקינו/אלקים) -> Elohim family
  return s;
}
const FOLD_MAP={'ע':'א','ט':'ת','ק':'כ','ח':'כ','ס':'ש'};
function fold(s){let o='';for(const c of s)o+=(FOLD_MAP[c]||c);return o;}
function foldAshk(s){ // extra leniency for Ashkenazi havara: sav (ת->ס) BEFORE the ס->ש fold, then "oy"->"o"
  return fold(s.replace(/ת/g,'ס')).replace(/וי/g,'ו');
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(!m)return n; if(!n)return m;
  let prev=new Array(n+1),cur=new Array(n+1);
  for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function ratio(a,b){
  if(!a.length&&!b.length)return 1;
  const d=lev(a,b);
  return 1-d/Math.max(a.length,b.length);
}

const MATRES=new Set(['א','ה','ו','י']);
function singleEdit(a,b){ // if a->b is one edit, return {type:'sub'|'ins'|'del', ca, cb}
  const la=a.length,lb=b.length;
  if(Math.abs(la-lb)>1)return null;
  if(la===lb){
    let d=-1;
    for(let i=0;i<la;i++)if(a[i]!==b[i]){if(d>=0)return null;d=i;}
    return d>=0?{type:'sub',ca:a[d],cb:b[d]}:null;
  }
  const [sh,lo]=la<lb?[a,b]:[b,a];
  let i=0;while(i<sh.length&&sh[i]===lo[i])i++;
  if(sh.slice(i)!==lo.slice(i+1))return null;
  return {type:la<lb?'ins':'del',ca:lo[i],cb:lo[i]};
}
function analyzeEdits(a,b,maxE){ // list of ≤maxE edits turning a into b, matres-insertions preferred; null if more
  if(a===b)return [];

  if(maxE<2)return null;

    const sub=dir==='ins'?analyzeEdits(sh,lo2,maxE-1):analyzeEdits(lo2,sh,maxE-1);

    if(SILENT_FINAL.has(ft.slice(-1))&&SILENT_FINAL.has(fg.slice(-1)))return 0.96;
  }
  if(ashk&&foldAshk(tNorm)===foldAshk(gNorm))return 0.94;
  if(gNorm.length<=2||tNorm.length<=2)return 0; // short words: sound-exact or nothing
  const edits=analyzeEdits(ft,fg,2);
  if(edits){
    const real=edits.filter(e=>e.type==='sub'||!MATRES.has(e.ca));
    if(real.length===0)return 0.9;   // only plene/defective spelling differences (extra י/ו etc.)
    if(real.length===1)return 0.55;  // ONE real sound wrong (e.g. ד/ר) -> "almost", flagged
    return 0.3;
  }
  let s=Math.max(ratio(tNorm,gNorm),ratio(ft,fg));
  if(ashk)s=Math.max(s,ratio(foldAshk(tNorm),foldAshk(gNorm)));
  return Math.min(s,0.62); // 2+ sounds differ: never auto-green
}
/* word states */
const ST={PENDING:0,OK:1,WARN:2,BAD:3};
const TH_OK=0.65, TH_WARN=0.35, TH_MERGE=0.72;
const MAX_SKIP=2; // a single match may skip at most this many un-read words (prevents line-leaps)
const STUCK_LIMIT=3; // after this many unmatched tokens on one word, give up on it and move on (prevents wedging)
const SKIP_TOKEN='__SKIP__';
function stateFor(s){return s>=TH_OK?ST.OK:(s>=TH_WARN?ST.WARN:ST.BAD);}

/* Full (re-)alignment of a token stream against the target words.
   Called on EVERY recognition update (including interim results), so coloring is
   near-instant and self-corrects as the recognizer firms up its transcript. */
function alignTokens(tokens,words,ashk){
  const st=new Array(words.length).fill(null); // per word: {state,score,heard} | null(pending)
  let c=0, streak=0, prev=null, skips=0; // skips = words auto-marked BAD by a jump-ahead (used for confidence/flagging)
  for(const raw of tokens){
    if(c>=words.length)break;
    if(raw===SKIP_TOKEN){ // manual skip / tap-ahead (deliberate, not counted as an auto-skip)
      st[c]={state:ST.BAD,score:0,heard:null};c++;prev=null;streak=0;continue;
    }
    const t=normTranscript(raw);
    if(!t)continue;

    // Anti-wedge: if we've failed to match the current word several times running, the recognizer
    // probably just can't hear it (common with liturgical Hebrew) - mark it uncertain and move on,
    // so the cursor never gets permanently stuck. One word at a time, so this is never a line-leap.
    if(streak>=STUCK_LIMIT){
      st[c]={state:ST.BAD,score:0,heard:null};skips++;c++;prev=null;streak=0;
      if(c>=words.length)break;
    }

    // (1) Does this token read the CURRENT word (possibly imperfectly)?
    const curS=simWords(t,words[c].norm,ashk);
    // (2) Merge: one spoken token covering the current word + the next one.
    const mS=(c+1<words.length)?simWords(t,words[c].norm+words[c+1].norm,ashk):0;
    // (3) Best match among the next few words - only as far ahead as we're allowed to skip.
    const skipEnd=Math.min(c+MAX_SKIP+1,words.length);
    let best=-1,bs=0;
    for(let i=c+1;i<skipEnd;i++){const s=simWords(t,words[i].norm,ashk);if(s>bs){bs=s;best=i;}}

    // Merge wins only if it clearly beats reading the current word alone.
    if(mS>=TH_MERGE&&mS>curS&&mS>=bs){
      st[c]={state:stateFor(mS),score:mS,heard:raw};
      st[c+1]={state:ST.WARN,score:mS,heard:raw}; // 2nd word not independently verified → "almost", not full credit
      c+=2;prev=null;streak=0;continue;
    }
    // Prefer reading the current word if it's acceptable - do NOT jump ahead when the current word matched.
    if(curS>=TH_WARN){
      st[c]={state:stateFor(curS),score:curS,heard:raw};
      c++;prev=null;streak=0;continue;
    }
    // Current word wasn't matched, but a word just ahead was heard - the student read past it.
    // Bounded by MAX_SKIP so a stray word can never leap a whole line.
    if(best>c&&bs>=TH_WARN&&best-c<=MAX_SKIP){
      for(let k=c;k<best;k++){st[k]={state:ST.BAD,score:0,heard:null};skips++;}
      st[best]={state:stateFor(bs),score:bs,heard:raw};
      c=best+1;prev=null;streak=0;continue;
    }
    // Split: recognizer broke one word into two tokens (prev + this) → the current word.
    if(prev){
      const js=simWords(prev.t+t,words[c].norm,ashk);
      if(js>=TH_OK){
        st[c]={state:stateFor(js),score:js,heard:prev.raw+' '+raw};
        c++;prev=null;streak=0;continue;
      }
    }
    // Unmatched token: keep it as a possible split fragment; count toward the anti-wedge streak.
    prev={t,raw};streak++;
  }
  return {st,cursor:c,skips};
}
function alignScore(tokens,words,ashk){ // used to pick the best ASR alternative
  const r=alignTokens(tokens,words,ashk);
  const mass=r.st.reduce((s,x)=>s+(x?x.score:0),0);
  return mass-0.5*(r.skips||0); // penalize auto-skipped gaps so a jump-ahead alternative can't win on raw mass
}

/* letter-level diff for mistake feedback */
function letterDiff(exp,heard){
  const a=exp,b=heard;
  const m=a.length,n=b.length;
  const dp=[];
  for(let i=0;i<=m;i++){dp[i]=[];for(let j=0;j<=n;j++){dp[i][j]=i===0?j:(j===0?i:Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)));}}
  const A=[],B=[];let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)){
      const d=a[i-1]!==b[j-1];A.unshift({c:a[i-1],diff:d});B.unshift({c:b[j-1],diff:d});i--;j--;
    }else if(i>0&&dp[i][j]===dp[i-1][j]+1){A.unshift({c:a[i-1],diff:true});i--;}
    else{B.unshift({c:b[j-1],diff:true});j--;}
  }
  return [A,B];
}
const CONFUSIONS=[[['ד','ר'],'Did you read a ד (dalet) as a ר (reish), or the other way around? Look for the corner on the dalet.'],
 [['ה','ח'],'ה (hey) vs ח (ches) - check whether the left leg has a gap at the top.'],
 [['ב','כ'],'ב (beis) vs כ (chaf) - the beis has a square corner and a little heel.'],
 [['ו','ז'],'ו (vav) vs ז (zayin) - the zayin has a crown on top.'],
 [['ג','נ'],'ג (gimmel) vs נ (nun) - the gimmel has a little foot.'],
 [['ט','מ'],'ט (tes) vs מ (mem) - check the opening.'],
 [['ע','צ'],'ע (ayin) vs צ (tzadi).'],
 [['ת','ח'],'ת (taf) vs ח (ches) - the taf has a foot on the left leg.']];
function classifyMistake(expN,heardN){
  if(!heardN)return 'This word was skipped or not heard.';
  const [A,B]=letterDiff(expN,heardN);
  const diffsA=A.filter(x=>x.diff).map(x=>x.c), diffsB=B.filter(x=>x.diff).map(x=>x.c);
  if(diffsA.length===1&&diffsB.length===1){
    for(const [pair,msg] of CONFUSIONS){
      if((pair[0]===diffsA[0]&&pair[1]===diffsB[0])||(pair[1]===diffsA[0]&&pair[0]===diffsB[0]))return msg;
    }
    if(fold(diffsA[0])===fold(diffsB[0]))return 'Very close - a letter may not have been pronounced clearly.';
    return 'One letter is different: expected "'+diffsA[0]+'" but heard "'+diffsB[0]+'".';
  }
  if(fold(expN)===fold(heardN))return 'Almost! It sounded very close - make sure to pronounce each letter clearly.';
  return 'This word sounded different - try reading it slowly, letter by letter.';
}

function activeSegs(bracha,settings){
  return bracha.segs.filter(s=>{
    switch(s.c){
      case 'always':return true;
      case 'winter':return settings.winter;
      case 'notwinter':return !settings.winter;
      case 'ayt':return settings.ayt;
      case 'notayt':return !settings.ayt;
      case 'rc':return settings.rc;
      case 'nissim':return settings.chanukah||settings.purim;
      case 'chanukah':return settings.chanukah;
      case 'purim':return settings.purim;
      default:return true;
    }
  });
}
function buildWords(bIdx,settings){
  const b=DATA.brachot[bIdx];
  const segs=activeSegs(b,settings);
  const words=[];const phrases=[];
  segs.forEach((seg,si)=>{
    const chunks=(seg.ph&&seg.ph.length)?seg.ph:seg.t.split(/(?<=[:.])\s+/).map(t=>({t}));
    chunks.forEach(ch=>{
      const pIdx=phrases.length;
      phrases.push({trans:ch.en||null,words:[],seg:si});
      ch.t.split(/\s+/).forEach(tok=>{
        const parts=tok.split('־');
        parts.forEach((p,pi)=>{
          const display=p+(pi<parts.length-1?'־':'');
          const n=norm(p);
          if(!n&&!/[א-ת]/.test(p))return;
          const w={display,norm:n,phrase:pIdx,state:ST.PENDING,score:0,heard:null};
          phrases[pIdx].words.push(words.length);
          words.push(w);
        });
      });
    });
  });
  return {words,phrases,name:b.he,en:b.en};
}

function micPolicyBlocked(){

class Listener{
  /* onCommit(altsTokenArrays) - a phrase just finalized; several ASR alternatives given.
     onInterim(tokens)        - live (unfinalized) words; fired continuously for instant feedback.
     onState(state)                                                                              */
  constructor({onCommit,onInterim,onState}){
    this.onCommit=onCommit;this.onInterim=onInterim;this.onState=onState;
    this.active=false;this.rec=null;this._restartT=null;this._nCommitted=0;
  }
  start(){
    if(!SR){this.onState('unsupported');return;}
    if(micPolicyBlocked()){this.onState('policy');return;}
    this.active=true;this._spin();this.onState('live');
  }
  _spin(){
    if(!this.active)return;
    const r=new SR();this.rec=r;this._nCommitted=0;
    r.lang='he-IL';r.continuous=true;r.interimResults=true;r.maxAlternatives=4;
    const toks=s=>s.trim().split(/\s+/).filter(Boolean);
    r.onresult=(e)=>{
      let interim=[];
      for(let i=0;i<e.results.length;i++){
        const res=e.results[i];
        if(res.isFinal){
          if(i>=this._nCommitted){            // newly finalized -> commit once
            const alts=[];
            for(let a=0;a<res.length;a++)alts.push(toks(res[a].transcript));
            this._nCommitted=i+1;
            if(alts.length&&alts[0].length)this.onCommit(alts);
          }
        }else interim=interim.concat(toks(res[0].transcript));
      }
      this.onInterim(interim);
    };
    r.onerror=(e)=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){this.active=false;this.onState('denied');}
      if(e.error==='audio-capture'){this.active=false;this.onState('nomic');}
    };
    r.onend=()=>{
      if(this.active){
        clearTimeout(this._restartT);
        this._restartT=setTimeout(()=>this._spin(),150);  // tighter restart -> fewer dead gaps
      }else this.onState('off');
    };
    try{r.start();}catch(_){/* already started */}
  }
  stop(){this.active=false;clearTimeout(this._restartT);try{this.rec&&this.rec.stop();}catch(_){}}
}
class Recorder{
  async start(){
    this.stream=await navigator.mediaDevices.getUserMedia({audio:true});
    this.chunks=[];
    this.mr=new MediaRecorder(this.stream,{mimeType:MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':''});
    this.mr.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data);};
    this.mr.start(1000);
  }
  stop(){
    return new Promise(res=>{
      if(!this.mr||this.mr.state==='inactive'){res(null);return;}
      this.mr.onstop=()=>{
        this.stream.getTracks().forEach(t=>t.stop());
        res(new Blob(this.chunks,{type:'audio/webm'}));
      };
      this.mr.stop();
    });
  }
}

async function gradeWithServer(blob,words,brachaNo){
  const fd=new FormData();
  fd.append('audio',blob,'reading.webm');
  fd.append('language','he');
  fd.append('expected_words',JSON.stringify(words.map(w=>w.display)));
  fd.append('bracha',String(brachaNo));
  if(window.crypto&&crypto.randomUUID)fd.append('attempt_id',crypto.randomUUID());
  const ctrl=new AbortController();
  const to=setTimeout(()=>ctrl.abort(),120000);

  try{r=await fetch(graderURL(),{method:'POST',body:fd,signal:ctrl.signal});}
  catch(e){throw new Error(e.name==='AbortError'?'the grading server timed out':'could not reach the grading server');}
  finally{clearTimeout(to);}
  let j=null;try{j=await r.json();}catch(_){}
  if(!r.ok||!j)throw new Error((j&&(j.detail||j.error))?(j.detail||j.error):('analysis server error '+r.status));
  if(typeof j.transcript!=='string'||!Array.isArray(j.words))throw new Error('invalid analysis response');
  return j;
}
function scoreServerAnalysis(result,words){
  const st=new Array(words.length).fill(null);let skips=0;
  const states={ok:ST.OK,almost:ST.WARN,wrong:ST.BAD,missing:ST.BAD};
  for(const row of result.words||[]){
    if(row.operation==='extra'){skips++;continue;}
    if(!Number.isInteger(row.expected_index)||row.expected_index<0||row.expected_index>=words.length)continue;
    const state=states[row.operation]??ST.BAD;
    st[row.expected_index]={state,score:Number(row.similarity)||0,heard:row.heard||null};
    if(row.operation==='missing')skips++;
  }
  for(let i=0;i<st.length;i++)if(!st[i]){st[i]={state:ST.BAD,score:0,heard:null};skips++;}
  return {st,skips};
}

function startSession(mode){
  const bIdx=view.bracha;
  const built=buildWords(bIdx,S.settings);
  session={
    mode,bIdx,words:built.words,phrases:built.phrases,
    startT:null,timerI:null,listener:null,recorder:null,audioBlob:null,
    insertions:0,done:false,
  };
  view={name:'session',bracha:bIdx,mode};
  render();
}
function sessionStats(){
  const w=session.words;
  const ok=w.filter(x=>x.state===ST.OK).length;
  const warn=w.filter(x=>x.state===ST.WARN).length;
  const bad=w.filter(x=>x.state===ST.BAD).length;
  const donew=ok+warn+bad;
  const acc=donew?Math.round(100*(ok+0.5*warn)/donew):0;
  return {ok,warn,bad,donew,acc,total:w.length};
}
function finalScore(){
  const w=session.words;
  const ok=w.filter(x=>x.state===ST.OK).length;
  const warn=w.filter(x=>x.state===ST.WARN).length;
  return Math.round(100*(ok+0.5*warn)/w.length);
}

  </div>
  ${isTest?`<div class="notice">📝 <b>Recorded Check:</b> read the whole bracha out loud, clearly and in order. Feedback appears at the end.</div>`
    :`<div class="notice" style="border-left-color:var(--accent);background:var(--cur-bg)">💡 Read at your normal pace - words light up as you go. Stuck on a word? Use <b>Skip ▶</b>. Want to re-read? Tap <b>◀ Back</b> or tap any earlier word to go back to it.</div>`}
  <div class="notice sayrule">🙏 When you reach <b>Hashem's Name</b> (marked <span class="heb">יְהֹוָה</span>), say the word <b>"Hashem"</b> out loud - not the Name itself.</div>
  <div class="card"><div class="tefilla heb" style="--tsize:${S.settings.tsize}rem">${phrasesHtml}</div></div>

function bindSession(){
  const isTest=session.mode==='test';
  const micBtn=document.getElementById('micBtn');
  const interimEl=document.getElementById('interim');
  const accEl=document.getElementById('liveAcc');
  const timerEl=document.getElementById('liveTimer');
  const finishBtn=document.getElementById('finishBtn');

  const skipBtn=document.getElementById('skipBtn');
  const backBtn=document.getElementById('backBtn');
  session.committed=[];   // chosen best-alternative tokens + skip markers
  session.interim=[];     // live unfinalized tokens
  session.cursor=0;
  const ashk=S.settings.ashk;

  // Re-align the ENTIRE transcript every update: instant feedback, self-correcting, never sticks.
  function reAlign(){
    const tokens=session.committed.concat(session.interim);
    const {st,cursor}=alignTokens(tokens,session.words,ashk);
    session.cursor=cursor;
    for(let i=0;i<session.words.length;i++){
      const a=st[i],w=session.words[i];
      w.state=a?a.state:ST.PENDING;w.score=a?a.score:0;w.heard=a?a.heard:null;
      if(!isTest){
        const el=document.getElementById('w'+i);
        if(el){
          el.classList.remove('ok','warn','bad');
          if(a)el.classList.add(a.state===ST.OK?'ok':a.state===ST.WARN?'warn':'bad');
        }
      }
    }
    updateCursorUI();
    const s2=sessionStats();
    accEl.textContent=s2.donew?s2.acc+'%':'';
  }

  function updateCursorUI(){
    document.querySelectorAll('.w.cur').forEach(e=>e.classList.remove('cur','listening'));
    document.querySelectorAll('.phrase.active').forEach(e=>e.classList.remove('active'));
    const c=session.cursor;
    if(c<session.words.length&&!isTest){
      const el=document.getElementById('w'+c);
      if(el){
        el.classList.add('cur');if(session.live)el.classList.add('listening');
        const ph=document.getElementById('ph'+session.words[c].phrase);
        ph&&ph.classList.add('active');
        el.scrollIntoView({block:'center',behavior:'smooth'});
      }
    }
  }

  function commitAndCheck(){
    session.interim=[];
    reAlign();
    if(session.cursor>=session.words.length)setTimeout(()=>{if(!session.done)endSession();},400);
  }

  // Rewind: drop just enough committed tokens so re-alignment lands at (or just before) `target`,
  // then let the student re-read from there. Cursor is a pure function of committed, so we truncate.
  function rewindToWord(target){
    target=Math.max(0,Math.min(target,session.words.length-1));
    let keep=0; // cursor is monotonic in prefix length, so find the longest prefix still at/behind target
    for(let n=0;n<=session.committed.length;n++){
      const {cursor}=alignTokens(session.committed.slice(0,n),session.words,ashk);
      if(cursor<=target)keep=n; else break;
    }
    session.committed=session.committed.slice(0,keep);
    session.interim=[];
    reAlign();
  }

  session.listener=new Listener({
    onCommit:(alts)=>{
      if(!session.startT)startTimer();
      let best=alts[0],bestSc=-1;                 // keep the ASR alternative that best fits the tefillah
      for(const alt of alts){
        const sc=alignScore(session.committed.concat(alt),session.words,ashk);
        if(sc>bestSc){bestSc=sc;best=alt;}
      }
      session.committed=session.committed.concat(best);
      commitAndCheck();
    },
    onInterim:(tokens)=>{
      if(!session.startT&&tokens.length)startTimer();
      session.interim=tokens;
      if(tokens.length)interimEl.innerHTML='<span class="hebtxt">'+esc(tokens.join(' '))+'</span>';
      reAlign();
    },
    onState:(st)=>{
      session.live=(st==='live');
      micBtn.classList.toggle('live',session.live);
      micBtn.textContent=session.live?'⏸':'🎤';
      if(skipBtn)skipBtn.style.display=session.live?'':'none';
      if(backBtn)backBtn.style.display=session.live?'':'none';
      if(MIC_MSG[st])interimEl.textContent=MIC_MSG[st];
      updateCursorUI();
    }
  });

  // Skip button: mark the current word missed and move on.
  if(skipBtn)skipBtn.addEventListener('click',()=>{
    session.committed=session.committed.concat(SKIP_TOKEN);
    commitAndCheck();
  });
  // Back button: step back one word to re-read it.
  if(backBtn)backBtn.addEventListener('click',()=>{rewindToWord(session.cursor-1);});
  // Tap any word: earlier → go back and re-read; later → jump ahead (pads skips in between).
  document.querySelectorAll('[data-w]').forEach(el=>el.addEventListener('click',()=>{
    if(isTest)return;
    const j=+el.dataset.w;
    if(j<session.cursor){rewindToWord(j);return;}
    if(j>session.cursor){
      for(let k=session.cursor;k<j;k++)session.committed.push(SKIP_TOKEN);
      commitAndCheck();
    }
  }));

  function startTimer(){
    session.startT=Date.now();
    session.timerI=setInterval(()=>{
      const s=Math.floor((Date.now()-session.startT)/1000);
      timerEl.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    },500);
  }

  micBtn.addEventListener('click',async()=>{
    if(session.live){session.listener.stop();return;}
    if(isTest&&!session.recorder){
      try{session.recorder=new Recorder();await session.recorder.start();}
      catch(e){
        const why={NotAllowedError:MIC_MSG.denied,NotFoundError:MIC_MSG.nomic,NotReadableError:'⚠️ The microphone is busy in another app.'}[e.name]||('⚠️ Recording failed: '+e.name);
        interimEl.textContent=why;session.recorder=null;return;
      }
    }
    session.listener.start();
    finishBtn.style.display='';
    if(!session.startT)startTimer();
  });
  finishBtn.addEventListener('click',()=>endSession());
  document.getElementById('exitSession').addEventListener('click',()=>{go({name:'bracha',bracha:session.bIdx});});
  const listenBtn=document.getElementById('listenBtn');
  AudioDB.get(session.bIdx).then(clip=>{
    if(!listenBtn)return;
    if(clip){
      listenBtn.style.display='';
      listenBtn.title='Listen to your teacher read this bracha';
      listenBtn.textContent='🔊👨‍🏫';
      listenBtn.onclick=()=>{
        if(session.refAudio&&!session.refAudio.paused){session.refAudio.pause();session.refAudio=null;listenBtn.textContent='🔊👨‍🏫';return;}
        session.refAudio=new Audio(URL.createObjectURL(clip));
        session.refAudio.onended=()=>{listenBtn.textContent='🔊👨‍🏫';};
        session.refAudio.play();listenBtn.textContent='⏸';
      };
    }else if(S.settings.tts&&('speechSynthesis' in window)){
      listenBtn.style.display='';
      listenBtn.title='Listen (computer voice - approximate, always says "Hashem")';
      listenBtn.onclick=()=>{
        // never let the computer voice attempt Hashem's name - substitute "Hashem"
        const spoken=session.words.map(w=>(w.norm==='יהוה'||w.norm==='אדני')?'הַשֵּׁם':w.display).join(' ');
        speakHebrew(spoken);
      };
    }
  }).catch(()=>{});
  if(DEBUG){
    const dbg=document.getElementById('dbg');
    dbg&&dbg.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        if(!session.startT)startTimer();
        session.committed=session.committed.concat(dbg.value.trim().split(/\s+/).filter(Boolean));
        dbg.value='';commitAndCheck();
      }
    });
  }
  reAlign();
}
async function endSession(){
  if(session.done)return;session.done=true;
  session.listener&&session.listener.stop();
  session.timerI&&clearInterval(session.timerI);
  const durMs=session.startT?Date.now()-session.startT:0;
  const isTest=session.mode==='test';
  // Stop the recording first - we need the audio for server grading (and playback).
  if(session.recorder){session.audioBlob=await session.recorder.stop();}
  // The browser path remains useful for practice. When server analysis is
  // enabled, a failed request must not silently become a passing server check.
  session.gradedBy='browser';session.serverErr=null;session.serverTranscript=null;session.serverResult=null;
  if(isTest&&S.settings.serverGrade&&session.audioBlob){
    const gv=document.getElementById('interim');
    if(gv)gv.innerHTML='⏳ Analyzing the recorded reading…';
    const mb=document.getElementById('micBtn');if(mb)mb.disabled=true;
    try{
      session.serverResult=await gradeWithServer(session.audioBlob,session.words,session.bIdx+1);
      session.serverTranscript=session.serverResult.transcript;
      session.gradedBy='server';
    }catch(e){session.serverErr=e.message||String(e);}
  }
  // Final scoring: structured server alignment or the live browser token aligner.
  // Grade the SAME token set the live view showed. Chrome often has not finalized the last
  // phrase (or several) when the student hits "I'm done"; those tokens live in session.interim.
  // Grading committed-only silently threw them away, so a correct read came back as skipped.
  const {st,skips}=(session.gradedBy==='server')
    ? scoreServerAnalysis(session.serverResult,session.words)
    : alignTokens(session.committed.concat(session.interim),session.words,S.settings.ashk);
  for(let i=0;i<session.words.length;i++){
    const a=st[i],w=session.words[i];
    w.state=a?a.state:ST.BAD;w.score=a?a.score:0;w.heard=a?a.heard:null;
    if(w.state!==ST.OK)S.wordErr[session.bIdx+':'+w.norm]=(S.wordErr[session.bIdx+':'+w.norm]||0)+1;
  }
  const score=session.gradedBy==='server'
    ? Math.max(0,Math.min(100,Number(session.serverResult.estimated_accuracy)||0))
    : finalScore();
  const stats=sessionStats();
  const wpm=durMs>=5000?Math.round(stats.ok/(durMs/60000)):0;
  // Confidence flag: the computer can't hear every letter distinction, so surface the reads it's unsure
  // about for the teacher to review rather than pretending the auto-grade is final.
  const warnRatio=stats.total?stats.warn/stats.total:0;
  const flagReasons=[];
  if(score>=55&&score<S.settings.masteryPct)flagReasons.push('score near the pass line');
  if(stats.warn>=3&&warnRatio>=0.15)flagReasons.push(stats.warn+' "almost" words');
  if((skips||0)>=2)flagReasons.push('several words skipped');
  if(session.gradedBy==='server'&&session.serverResult.review_required){
    flagReasons.push(...(session.serverResult.review_reasons||[]));
  }
  if(isTest&&session.gradedBy==='browser'){
    flagReasons.push(session.serverErr?'server analysis unavailable':'browser-only estimate');
  }
  const flagged=isTest&&flagReasons.length>0;
  const progressEligible=!(isTest&&S.settings.serverGrade&&session.gradedBy!=='server');
  let newlyMastered=false;
  if(isTest){
    const p=S.progress[session.bIdx]||{mastered:false,best:0,attempts:0};
    p.attempts++;p.lastDate=new Date().toISOString().slice(0,10);
    if(score>p.best)p.best=score;
    if(progressEligible&&score>=S.settings.masteryPct&&!p.mastered){p.mastered=true;newlyMastered=true;}
    S.progress[session.bIdx]=p;
    const missed=session.words.map((w,i)=>w.state===ST.BAD?i:-1).filter(i=>i>=0);
    const partial=session.words.map((w,i)=>w.state===ST.WARN?i:-1).filter(i=>i>=0);
    session.resultCode=encodeResult({v:2,n:S.profile.name,c:S.profile.cls,b:session.bIdx+1,bn:DATA.brachot[session.bIdx].he,d:p.lastDate,a:score,w:wpm,dur:Math.round(durMs/1000),m:missed,p:partial,tw:session.words.length,fl:flagged?1:0,fr:[...new Set(flagReasons)],g:session.gradedBy==='server'?1:0,tr:(session.serverTranscript||'').slice(0,400),aid:session.serverResult?session.serverResult.attempt_id:null,rt:session.serverResult?session.serverResult.result_token:null});
    S.history.unshift({b:session.bIdx,a:score,d:p.lastDate,f:flagged?1:0});S.history=S.history.slice(0,50);
  }
  saveStore();
  session.final={score,wpm,durMs,newlyMastered,flagged,flagReasons:[...new Set(flagReasons)],progressEligible};
  view={name:'results'};
  render();
  if(newlyMastered)confetti();
}

    a.download=`${S.profile.name}_${S.profile.cls}_bracha${session.bIdx+1}_${new Date().toISOString().slice(0,10)}.webm`.replace(/\s+/g,'-');
    a.click();
  });
  const cp=document.getElementById('copyCode');
  if(cp)cp.addEventListener('click',async()=>{
    const t=document.getElementById('rcode');
    try{await navigator.clipboard.writeText(t.value);}catch(_){t.select();document.execCommand('copy');}
    document.getElementById('copied').textContent='Copied ✔';
  });
  const ag=document.getElementById('again');
  if(ag)ag.addEventListener('click',()=>{const m=session.mode,b=session.bIdx;teardownSession();view={name:'bracha',bracha:b};startSession(m);});
  const nx=document.getElementById('nextBracha');
  if(nx)nx.addEventListener('click',()=>{const b=Math.min(session.bIdx+1,DATA.brachot.length-1);teardownSession();go({name:'bracha',bracha:b});});
}

function bindTeacher(){
  let rows=[];
  document.getElementById('unlockAll').addEventListener('change',e=>{S.settings.unlockAll=e.target.checked;saveStore();});

  /* --- accurate server grading (beta) --- */
  const sg=document.getElementById('serverGrade');
  if(sg)sg.addEventListener('change',e=>{S.settings.serverGrade=e.target.checked;saveStore();});
  const gu=document.getElementById('graderUrl');
  if(gu)gu.addEventListener('change',e=>{const v=e.target.value.trim();if(v)localStorage.setItem('se-grader-url',v);else localStorage.removeItem('se-grader-url');});
  const tg=document.getElementById('testGrader');
  if(tg)tg.addEventListener('click',async()=>{
    const st=document.getElementById('graderStatus');st.textContent='Checking…';
    try{
      const r=await fetch(graderHealthURL(),{method:'GET'});const j=await r.json();
      st.textContent=r.ok?('✅ Connected ('+(j.model||'model configured')+')'):('⚠️ Server responded '+r.status);
    }catch(e){st.textContent='⚠️ Could not reach the server. Is it running?';}
  });

  /* --- reference recording studio --- */
  const refRows=document.getElementById('refRows');
  let refRec=null,refRecIdx=-1,playingA=null;
  async function drawRefRows(){
    const have=new Set(await AudioDB.keys().catch(()=>[]));
    refRows.innerHTML=DATA.brachot.map((b,i)=>`<tr>
      <td style="width:30px">${i+1}</td>
      <td><span class="heb">${esc(b.he)}</span></td>
      <td style="width:110px">${have.has(i)?'<span style="color:var(--ok)">● recorded</span>':'<span class="muted">-</span>'}</td>
      <td style="width:230px">
        <button data-refrec="${i}">${refRecIdx===i?'⏹ Stop':'🎙️ Record'}</button>
        ${have.has(i)?`<button data-refplay="${i}">▶</button><button data-refdel="${i}" title="Delete">🗑</button>`:''}
      </td></tr>`).join('');
    refRows.querySelectorAll('[data-refrec]').forEach(el=>el.addEventListener('click',async()=>{
      const i=+el.dataset.refrec;
      if(refRecIdx===i){ // stop & save
        const blob=await refRec.stop();refRec=null;refRecIdx=-1;
        if(blob&&blob.size>1000)await AudioDB.set(i,blob);
        drawRefRows();return;
      }
      if(refRecIdx>=0){const b=await refRec.stop();if(b&&b.size>1000)await AudioDB.set(refRecIdx,b);refRec=null;refRecIdx=-1;}
      try{refRec=new Recorder();await refRec.start();refRecIdx=i;drawRefRows();}
      catch(e){alert('Microphone not available: '+e.name);refRec=null;refRecIdx=-1;}
    }));
    refRows.querySelectorAll('[data-refplay]').forEach(el=>el.addEventListener('click',async()=>{
      if(playingA){playingA.pause();playingA=null;}
      const blob=await AudioDB.get(+el.dataset.refplay);
      if(blob){playingA=new Audio(URL.createObjectURL(blob));playingA.play();}
    }));
    refRows.querySelectorAll('[data-refdel]').forEach(el=>el.addEventListener('click',async()=>{
      await AudioDB.del(+el.dataset.refdel);drawRefRows();
    }));
  }
  drawRefRows();
  document.getElementById('expPack').addEventListener('click',async()=>{
    const st=document.getElementById('packStatus');st.textContent='Packing…';
    const keys=await AudioDB.keys().catch(()=>[]);
    if(!keys.length){st.textContent='No recordings yet - record at least one bracha first.';return;}
    const clips={};
    for(const k of keys){const b=await AudioDB.get(k);if(b)clips[k]={b64:await blobToB64(b),type:b.type||'audio/webm'};}
    const pack={v:1,kind:'se-voice-pack',teacher:S.profile?S.profile.name:'',date:new Date().toISOString().slice(0,10),clips};
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(pack)],{type:'application/json'}));
    a.download='tefillah-voice-pack.json';a.click();
    st.textContent=`Exported ${keys.length} recording(s). Share the file with your students.`;
  });
  document.getElementById('parseCodes').addEventListener('click',()=>{
    const lines=document.getElementById('codes').value.split(/\s+/).filter(x=>x.startsWith('SET1.'));
    rows=lines.map(decodeResult).filter(Boolean);
    const tbl=document.getElementById('tbl');
    if(!rows.length){tbl.innerHTML='<p class="muted">No valid codes found.</p>';return;}
    rows.sort((a,b)=>(b.fl?1:0)-(a.fl?1:0)); // flagged reads first - those are the ones to listen to
    tbl.innerHTML=`<table><thead><tr><th>Review?</th><th>Name</th><th>Class</th><th>Bracha</th><th>Score</th><th>WPM</th><th>Date</th><th>Errors</th></tr></thead><tbody>${
      rows.map(r=>`<tr${r.fl?' style="background:var(--warn-bg)"':''}><td title="${esc((r.fr||[]).join('; '))}">${r.fl?'⚑':''}</td><td>${esc(r.n)}</td><td>${esc(r.c)}</td><td>${r.b}. <span class="heb">${esc(r.bn||'')}</span></td><td><b>${r.a}%</b></td><td>${r.w||'-'}</td><td>${esc(r.d)}</td><td>${(r.m||[]).length} missed, ${(r.p||[]).length} almost</td></tr>`).join('')
    }</tbody></table>`;
    document.getElementById('csvBtn').style.display='';
  });
  document.getElementById('csvBtn').addEventListener('click',()=>{
    const csv='﻿'+['Name,Class,Bracha,Score,WPM,Date,Missed,Almost,TotalWords,Flagged,FlagReasons',
      ...rows.map(r=>[r.n,r.c,r.b+' '+(r.bn||''),r.a,r.w,r.d,(r.m||[]).length,(r.p||[]).length,r.tw,r.fl?'YES':'',(r.fr||[]).join('; ')].map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(','))].join('\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='shemoneh-esrei-results.csv';a.click();
  });
  document.getElementById('thresh').addEventListener('change',e=>{S.settings.masteryPct=Math.max(50,Math.min(100,+e.target.value||90));saveStore();});
}

function bindSettings(){
  document.querySelectorAll('[data-set]').forEach(el=>{
    el.addEventListener('change',()=>{
      const k=el.dataset.set;
      S.settings[k]=el.type==='checkbox'?el.checked:+el.value;
      saveStore();
    });
  });
  document.getElementById('saveProf').addEventListener('click',()=>{
    S.profile={name:document.getElementById('edName').value.trim()||'Student',cls:document.getElementById('edCls').value.trim()||''};
    saveStore();render();
  });
  document.getElementById('expProg').addEventListener('click',()=>{
    const t=document.getElementById('progCode');t.style.display='';
    t.value='SEP1.'+btoa(unescape(encodeURIComponent(JSON.stringify({p:S.profile,g:S.progress,e:S.wordErr}))));
    t.select();try{document.execCommand('copy');}catch(_){}
  });
  document.getElementById('impProg').addEventListener('click',()=>{
    const t=document.getElementById('progCode');
    if(t.style.display==='none'){t.style.display='';t.value='';t.placeholder='Paste a SEP1. backup code here and click again';t.focus();return;}
    const v=t.value.trim();
    if(v.startsWith('SEP1.')){
      try{const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
        if(o.p)S.profile=o.p;if(o.g)S.progress=o.g;if(o.e)S.wordErr=o.e;
        saveStore();render();}catch(_){alert('Invalid code');}
    }
  });
  document.getElementById('resetAll').addEventListener('click',()=>{
    if(confirm('Reset ALL progress and the profile on this device?')){localStorage.removeItem(LSK);location.reload();}
  });
  /* voice picker (computer-voice fallback) */
  const voiceRow=document.getElementById('voiceRow'),voiceSel=document.getElementById('voiceSel');
  function fillVoices(){
    const vs=hebVoices();
    if(!vs.length)return;
    voiceRow.style.display='';
    const cur=pickVoice();
    voiceSel.innerHTML=vs.map(v=>`<option value="${esc(v.voiceURI)}" ${cur&&v.voiceURI===cur.voiceURI?'selected':''}>${esc(v.name)}</option>`).join('');
  }
  if('speechSynthesis' in window){
    fillVoices();
    speechSynthesis.onvoiceschanged=fillVoices;
    voiceSel.addEventListener('change',()=>{S.settings.voiceURI=voiceSel.value;saveStore();});
    document.getElementById('voiceTest').addEventListener('click',()=>speakHebrew('שָׁלוֹם תַּלְמִידִים, בְּהַצְלָחָה!'));
  }
  /* voice pack import */
  const packInfo=document.getElementById('packInfo');
  AudioDB.keys().then(ks=>{if(ks.length)packInfo.textContent=ks.length+' teacher recording(s) loaded on this device.';}).catch(()=>{});
  document.getElementById('packFile').addEventListener('change',async(e)=>{
    const f=e.target.files[0];if(!f)return;
    packInfo.textContent='Loading…';
    try{
      const pack=JSON.parse(await f.text());
      if(pack.kind!=='se-voice-pack'||!pack.clips)throw new Error('not a voice pack');
      let n=0;
      for(const [k,c] of Object.entries(pack.clips)){await AudioDB.set(+k,b64ToBlob(c.b64,c.type));n++;}
      packInfo.textContent=`✅ Loaded ${n} recording(s)${pack.teacher?' from '+pack.teacher:''}. The 🔊👨‍🏫 button is now available in practice.`;
    }catch(err){packInfo.textContent='❌ That file is not a valid voice pack.';}
  });
}

/* ---- confetti ---- */
function confetti(){
  const c=document.createElement('div');c.className='confetti';
  const colors=['#e8b931','#2456a6','#187a4b','#b3383e','#7aa7e8'];
  for(let i=0;i<80;i++){
    const p=document.createElement('i');
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.8)+'s';
    p.style.transform='rotate('+Math.random()*360+'deg)';
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),3600);
}

/* ---- render / routing ---- */
function render(){
  let body='';
  switch(view.name){
    case 'welcome':body=vWelcome();break;
    case 'home':body=header()+vHome();break;
    case 'bracha':body=header()+vBracha();break;
    case 'session':body=vSession();break;
    case 'results':body=header()+vResults();break;
    case 'teacher':body=header()+vTeacher();break;
    case 'help':body=header()+vHelp();break;
    case 'settings':body=header()+vSettings();break;
  }
  app.innerHTML=body;
  app.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go({name:el.dataset.go,bracha:view.bracha})));
  if(view.name==='welcome'){
    document.getElementById('pf-go').addEventListener('click',()=>{
      const n=document.getElementById('pf-name').value.trim();
      if(!n){document.getElementById('pf-name').focus();return;}
      S.profile={name:n,cls:document.getElementById('pf-cls').value.trim()};
      saveStore();go({name:'home'});
    });
    document.getElementById('teacherSkip').addEventListener('click',(e)=>{
      e.preventDefault();
      S.profile={name:'Teacher',cls:''};
      S.settings.unlockAll=true;
      saveStore();go({name:'home'});
    });
  }
  if(view.name==='home'){
    app.querySelectorAll('.rung').forEach(el=>{
      const i=+el.dataset.bracha;
      const open=()=>{if(isUnlocked(i))go({name:'bracha',bracha:i});};
      el.addEventListener('click',open);
      el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')open();});
    });
  }
  if(view.name==='bracha'){
    app.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>startSession(el.dataset.mode)));
  }
  if(view.name==='session')bindSession();
  if(view.name==='results')bindResults();
  if(view.name==='teacher')bindTeacher();
  if(view.name==='help')bindHelp();
  if(view.name==='settings')bindSettings();
}
render();
</script>
